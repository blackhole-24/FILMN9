<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FILMN9 — 주가 차트 프로토타입</title>
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0f1117;
    color: #e0e0e0;
    font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    font-size: 13px;
  }

  /* ── 검색 바 ── */
  #search-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 16px;
    background: #1a1d27;
    border-bottom: 1px solid #2a2d3a;
  }
  #search-bar input {
    flex: 1;
    max-width: 280px;
    padding: 7px 12px;
    background: #252836;
    border: 1px solid #3a3d4a;
    border-radius: 6px;
    color: #e0e0e0;
    font-size: 13px;
    outline: none;
  }
  #search-bar input:focus { border-color: #4a6fa5; }
  #search-bar button {
    padding: 7px 16px;
    background: #2a4a8a;
    border: none;
    border-radius: 6px;
    color: #fff;
    cursor: pointer;
    font-size: 13px;
  }
  #search-bar button:hover { background: #3a5a9a; }
  #corp-title {
    font-size: 15px;
    font-weight: bold;
    color: #ffffff;
  }
  #price-info {
    margin-left: auto;
    display: flex;
    gap: 16px;
    align-items: center;
    font-size: 13px;
  }
  #current-price { font-size: 18px; font-weight: bold; }
  .up   { color: #ef4444; }
  .down { color: #3b82f6; }
  .flat { color: #9ca3af; }

  /* ── KRX 로고 ── */
  #krx-badge {
    display: inline-flex;
    align-items: center;
    height: 18px;
  }
  #krx-badge img {
    height: 18px;
    width: auto;
    display: block;
  }
  #price-source {
    color: #9ca3af;
    font-size: 11px;
  }
  #price-source .ps-tag {
    color: #d1d5db;
    background: rgba(255,255,255,0.05);
    padding: 1px 6px;
    border-radius: 3px;
    margin-right: 4px;
  }

  /* ── 기간 버튼 ── */
  #period-bar {
    display: flex;
    gap: 4px;
    padding: 8px 16px;
    background: #1a1d27;
    border-bottom: 1px solid #2a2d3a;
  }
  .period-btn {
    padding: 4px 12px;
    background: #252836;
    border: 1px solid #3a3d4a;
    border-radius: 4px;
    color: #9ca3af;
    cursor: pointer;
    font-size: 12px;
  }
  .period-btn:hover  { background: #2a2d3e; color: #e0e0e0; }
  .period-btn.active { background: #2a4a8a; border-color: #4a6fa5; color: #fff; }

  /* ── 지표 토글 ── */
  #indicator-bar {
    display: flex;
    gap: 12px;
    padding: 6px 16px;
    background: #1a1d27;
    border-bottom: 1px solid #2a2d3a;
    align-items: center;
  }
  .toggle-label {
    display: flex;
    align-items: center;
    gap: 5px;
    cursor: pointer;
    font-size: 12px;
    user-select: none;
  }
  .toggle-label input { cursor: pointer; }
  .dot-ma5  { width:10px; height:2px; background:#d97706; display:inline-block; }
  .dot-ma20 { width:10px; height:2px; background:#7c3aed; display:inline-block; }
  .dot-ma60 { width:10px; height:2px; background:#059669; display:inline-block; }
  .dot-bb   { width:10px; height:4px; background:#db2777; display:inline-block; }

  /* ── 차트 좌상단 고정 정보 패널 (토스 스타일, 흰 배경 대응) ── */
  #info-panel {
    position: absolute;
    top: 6px;
    left: 18px;
    z-index: 15;
    background: rgba(255, 255, 255, 0.92);
    border: 1px solid #e5e7eb;
    border-radius: 4px;
    padding: 4px 10px;
    font-size: 12px;
    line-height: 1.6;
    pointer-events: none;
    color: #1f2937;
  }
  #info-panel .ip-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  #info-panel .ip-row + .ip-row { margin-top: 2px; }

  #info-panel .ip-date     { color: #6b7280; font-size: 11px; margin-right: 4px; }
  #info-panel .ip-label    { color: #6b7280; font-size: 11px; }
  #info-panel .ip-val      { color: #111827; font-weight: 600; }
  #info-panel .ip-pct      { font-size: 11px; }
  #info-panel .pct-up      { color: #ef4444; }
  #info-panel .pct-down    { color: #3b82f6; }
  #info-panel .pct-flat    { color: #6b7280; }
  #info-panel .ip-ma-tag   { font-weight: 700; font-size: 11px; }
  #info-panel .ma5-c   { color: #d97706; }
  #info-panel .ma20-c  { color: #7c3aed; }
  #info-panel .ma60-c  { color: #059669; }

  /* ── 차트 컨테이너 ── */
  #chart-wrap {
    position: relative;
    padding: 0 8px 16px;
    background: #0f1117;
  }
  #candle-chart  { width: 100%; height: 420px; }
  #volume-chart  { width: 100%; height: 110px; margin-top: 2px; }

  /* ── 로딩 / 에러 오버레이 ── */
  #status {
    display: none;
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(15,17,23,0.85);
    z-index: 10;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: #6b7280;
    font-size: 14px;
  }
  #status.visible { display: flex; }

  /* ── 툴팁 (Lightweight Charts 기본 제공) ── */
</style>
</head>
<body>

<!-- 검색 바 -->
<div id="search-bar">
  <input id="input-code" type="text" placeholder="종목코드 또는 기업명 (예: 090430, 삼성전자)" value="090430">
  <button onclick="loadChart()">검색</button>
  <span id="corp-title">—</span>
  <div id="price-info">
    <span id="current-price">—</span>
    <span id="change-info">—</span>
    <span id="price-source">—</span>
    <span id="krx-badge" title="출처: 한국거래소 (KRX)">
      <img src="assets/krx_logo.png" alt="한국거래소" onerror="this.style.display='none'; this.parentElement.textContent='KRX';">
    </span>
  </div>
</div>

<!-- 기간 버튼 -->
<div id="period-bar">
  <button class="period-btn" data-months="1"   onclick="setPeriod(1)">1개월</button>
  <button class="period-btn" data-months="3"   onclick="setPeriod(3)">3개월</button>
  <button class="period-btn" data-months="6"   onclick="setPeriod(6)">6개월</button>
  <button class="period-btn active" data-months="12" onclick="setPeriod(12)">1년</button>
  <button class="period-btn" data-months="36"  onclick="setPeriod(36)">3년</button>
  <button class="period-btn" data-months="0"   onclick="setPeriod(0)">전체</button>
</div>

<!-- 지표 토글 -->
<div id="indicator-bar">
  <span style="color:#6b7280; font-size:12px;">지표:</span>
  <label class="toggle-label">
    <input type="checkbox" id="chk-ma5" checked onchange="toggleSeries('ma5')">
    <span class="dot-ma5"></span> MA5
  </label>
  <label class="toggle-label">
    <input type="checkbox" id="chk-ma20" checked onchange="toggleSeries('ma20')">
    <span class="dot-ma20"></span> MA20
  </label>
  <label class="toggle-label">
    <input type="checkbox" id="chk-ma60" checked onchange="toggleSeries('ma60')">
    <span class="dot-ma60"></span> MA60
  </label>
  <label class="toggle-label">
    <input type="checkbox" id="chk-bb" onchange="toggleSeries('bb')">
    <span class="dot-bb"></span> 볼린저밴드
  </label>
</div>

<!-- 차트 -->
<div id="chart-wrap">
  <div id="candle-chart"></div>
  <div id="volume-chart"></div>
  <div id="info-panel">
    <div class="ip-row">
      <span class="ip-date" id="ip-date">—</span>
      <span class="ip-label">시</span><span class="ip-val" id="ip-open">—</span><span class="ip-pct" id="ip-open-pct"></span>
      <span class="ip-label">고</span><span class="ip-val" id="ip-high">—</span><span class="ip-pct" id="ip-high-pct"></span>
      <span class="ip-label">저</span><span class="ip-val" id="ip-low">—</span><span class="ip-pct" id="ip-low-pct"></span>
      <span class="ip-label">종</span><span class="ip-val" id="ip-close">—</span><span class="ip-pct" id="ip-close-pct"></span>
    </div>
    <div class="ip-row">
      <span class="ip-label">이동평균선</span>
      <span class="ip-ma-tag ma5-c">5</span><span class="ip-val" id="ip-ma5">—</span>
      <span class="ip-ma-tag ma20-c">20</span><span class="ip-val" id="ip-ma20">—</span>
      <span class="ip-ma-tag ma60-c">60</span><span class="ip-val" id="ip-ma60">—</span>
      <span class="ip-label" style="margin-left:8px;">거래량</span>
      <span class="ip-val" id="ip-volume">—</span>
    </div>
  </div>
  <div id="status" class="visible">데이터를 불러오는 중...</div>
</div>

<script>
const API = 'http://localhost:8000';

// ── 차트 인스턴스 ──────────────────────────────────────────────────────────────
let candleChart = null, volumeChart = null;
let candleSeries = null, volumeSeries = null;
let seriesMap       = {};   // ma5, ma20, ma60, bbUpper, bbMid, bbLower
let allData         = [];   // 전체 OHLCV
let displayedData   = [];   // 현재 화면에 표시 중인 필터링된 데이터
let displayedBars   = 0;    // displayedData.length
let _maCache        = { ma5: [], ma20: [], ma60: [] };   // 인덱스별 MA 값 캐시
let currentPeriod = 12;

// ── 색상 상수 (한국식: 상승=빨강, 하락=파랑) ──────────────────────────────────
const C_UP   = '#ef4444';
const C_DOWN = '#3b82f6';
const C_FLAT = '#9ca3af';

// ── 차트 초기화 ───────────────────────────────────────────────────────────────
function initCharts() {
  // ── 날짜 포맷: '25/5/15 형식 ─────────────────────────────────────────────
  // Lightweight Charts는 상황에 따라 BusinessDay 객체 / timestamp / 문자열을 전달
  const dateFmt = (t) => {
    let year, month, day;
    if (t && typeof t === 'object' && 'year' in t) {
      // BusinessDay: {year, month, day}
      year = t.year; month = t.month; day = t.day;
    } else if (typeof t === 'number') {
      // UTC timestamp (초 단위)
      const d = new Date(t * 1000);
      year = d.getUTCFullYear(); month = d.getUTCMonth() + 1; day = d.getUTCDate();
    } else if (typeof t === 'string') {
      // "YYYY-MM-DD" 문자열
      const parts = t.split('-').map(Number);
      year = parts[0]; month = parts[1]; day = parts[2];
    }
    if (!year) return '';
    const yy = String(year).slice(2);
    const mm = String(month).padStart(2, '0');
    const dd = String(day).padStart(2, '0');
    return `'${yy}/${mm}/${dd}`;
  };

  // ── 핵심: LW Charts 내장 경계 옵션 사용 ──────────────────────────────
  // fixLeftEdge / fixRightEdge: 데이터 너머 스크롤·줌아웃 자체를 차단
  // lockVisibleTimeRangeOnResize: 리사이즈 시 가시 범위 유지 → 설정 풀림 방지
  const _tsOpts = {
    borderColor                 : '#d1d5db',
    timeVisible                 : false,
    tickMarkFormatter           : dateFmt,
    fixLeftEdge                 : true,
    fixRightEdge                : true,
    lockVisibleTimeRangeOnResize: true,
    rightBarStaysOnScroll       : true,
  };
  const commonOpts = {
    layout          : { background: { color: '#ffffff' }, textColor: '#374151' },
    grid            : { vertLines: { color: '#f3f4f6' }, horzLines: { color: '#f3f4f6' } },
    crosshair       : {
      mode      : LightweightCharts.CrosshairMode.Normal,
      vertLine  : { color: '#6b7280', labelBackgroundColor: '#374151' },
      horzLine  : { color: '#6b7280', labelBackgroundColor: '#374151' },
    },
    leftPriceScale  : { visible: false },                            // 좌측 숨김
    rightPriceScale : { visible: true,  borderColor: '#d1d5db' },   // 우측 가격축
    timeScale       : _tsOpts,
    localization    : { timeFormatter: dateFmt },
    handleScroll    : {
      mouseWheel       : false,   // 휠 = 줌 전용
      pressedMouseMove : true,    // 드래그로 좌우 이동
      horzTouchDrag    : true,
      vertTouchDrag    : false,
    },
    handleScale     : {
      mouseWheel           : true,
      pinch                : true,
      axisPressedMouseMove : false,
      axisDoubleClickReset : false,
    },
  };

  // 캔들차트 — 사용자 입력 받음
  const candleEl = document.getElementById('candle-chart');
  candleChart = LightweightCharts.createChart(candleEl, {
    ...commonOpts,
    height: 420,
    timeScale: { ..._tsOpts, barSpacing: 8 },
  });

  // 거래량 차트 — 입력 차단, 캔들 일방향 동기화 수신만
  const volEl = document.getElementById('volume-chart');
  volumeChart = LightweightCharts.createChart(volEl, {
    ...commonOpts,
    height          : 110,
    leftPriceScale  : { visible: false },
    rightPriceScale : { visible: true, borderColor: '#d1d5db', scaleMargins: { top: 0.1, bottom: 0 } },
    timeScale       : { ..._tsOpts, visible: true, barSpacing: 8 },
    handleScroll    : false,
    handleScale     : false,
  });

  // 캔들스틱 — 우측 가격축
  candleSeries = candleChart.addCandlestickSeries({
    upColor:   C_UP,   wickUpColor:   C_UP,
    downColor: C_DOWN, wickDownColor: C_DOWN,
    borderVisible: false,
    priceScaleId: 'right',
  });

  // 거래량 히스토그램 — 우측 가격축
  volumeSeries = volumeChart.addHistogramSeries({
    priceFormat: { type: 'volume' },
    priceScaleId: 'right',
  });

  // MA 라인들 — 우측 가격축
  const _lineOpts = { lineWidth: 1, priceLineVisible: false, lastValueVisible: false, priceScaleId: 'right' };
  seriesMap.ma5  = candleChart.addLineSeries({ ..._lineOpts, color: '#d97706' });   // 짙은 주황
  seriesMap.ma20 = candleChart.addLineSeries({ ..._lineOpts, color: '#7c3aed' });   // 짙은 보라
  seriesMap.ma60 = candleChart.addLineSeries({ ..._lineOpts, color: '#059669' });   // 짙은 초록

  // 볼린저밴드 (초기 숨김) — 밝은 마젠타, 굵게, 흰 배경에서 최고 가시성
  seriesMap.bbUpper = candleChart.addLineSeries({ ..._lineOpts, color: '#db2777', lineWidth: 3, lineStyle: 0, visible: false });
  seriesMap.bbMid   = candleChart.addLineSeries({ ..._lineOpts, color: '#9d174d', lineWidth: 2, lineStyle: 2, visible: false });
  seriesMap.bbLower = candleChart.addLineSeries({ ..._lineOpts, color: '#db2777', lineWidth: 3, lineStyle: 0, visible: false });

  // ── 일방향 동기화: 캔들 → 거래량 ────────────────────────────────────────
  // volume 차트는 입력이 차단되어 있으므로 자체 이벤트 발생 X
  // 양방향 구독 시의 피드백 루프·_syncing 플래그·재진입 문제 모두 제거
  // 경계 클램핑은 fixLeftEdge/fixRightEdge로 LW Charts가 자체 처리
  candleChart.timeScale().subscribeVisibleLogicalRangeChange(range => {
    if (range) volumeChart.timeScale().setVisibleLogicalRange(range);
  });

  // ── 좌상단 정보 패널 갱신 (토스 스타일) ───────────────────────────────
  const fmtPrice = n => (n == null ? '—' : Math.round(n).toLocaleString('ko-KR'));
  const fmtVol   = n => {
    if (n == null) return '—';
    if (n >= 1e8) return (n / 1e8).toFixed(2) + '억';
    if (n >= 1e4) return (n / 1e4).toFixed(1) + '만';
    return n.toLocaleString('ko-KR');
  };

  function _ts2key(t) {
    if (t == null) return null;
    // 1) BusinessDay {year, month, day}
    if (typeof t === 'object' && typeof t.year === 'number') {
      return `${t.year}-${String(t.month).padStart(2,'0')}-${String(t.day).padStart(2,'0')}`;
    }
    // 2) "YYYY-MM-DD" 문자열 (이미 우리 데이터 형식과 일치)
    if (typeof t === 'string') {
      return t;
    }
    // 3) UTC timestamp (초)
    if (typeof t === 'number') {
      const d = new Date(t * 1000);
      if (isNaN(d.getTime())) return null;
      return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`;
    }
    return null;
  }

  // %변동 계산 + DOM 적용
  function _setPct(elId, cur, prev) {
    const el = document.getElementById(elId);
    if (cur == null || prev == null || prev === 0) { el.textContent = ''; return; }
    const pct  = ((cur - prev) / prev) * 100;
    const sign = pct > 0 ? '+' : '';
    el.textContent = `(${sign}${pct.toFixed(2)}%)`;
    el.className = 'ip-pct ' + (pct > 0 ? 'pct-up' : pct < 0 ? 'pct-down' : 'pct-flat');
  }

  // 정보 패널에 한 바(bar) + 이전 바(prevClose)로 값 채우기
  function _renderInfoPanel(bar, prevClose, ma5v, ma20v, ma60v, vol, dateStr) {
    if (!bar) return;
    document.getElementById('ip-date').textContent  = dateStr || '';
    document.getElementById('ip-open').textContent  = fmtPrice(bar.open);
    document.getElementById('ip-high').textContent  = fmtPrice(bar.high);
    document.getElementById('ip-low').textContent   = fmtPrice(bar.low);
    document.getElementById('ip-close').textContent = fmtPrice(bar.close);
    _setPct('ip-open-pct',  bar.open,  prevClose);
    _setPct('ip-high-pct',  bar.high,  prevClose);
    _setPct('ip-low-pct',   bar.low,   prevClose);
    _setPct('ip-close-pct', bar.close, prevClose);
    document.getElementById('ip-ma5').textContent  = fmtPrice(ma5v);
    document.getElementById('ip-ma20').textContent = fmtPrice(ma20v);
    document.getElementById('ip-ma60').textContent = fmtPrice(ma60v);
    document.getElementById('ip-volume').textContent = fmtVol(vol);
  }

  // 커서가 벗어났을 때: 마지막(최신) 바 정보 표시
  function showLatestInfo() {
    if (!displayedData.length) return;
    const i = displayedData.length - 1;
    const bar  = displayedData[i];
    const prev = i > 0 ? displayedData[i - 1].close : bar.open;
    _renderInfoPanel(
      bar, prev,
      _maCache.ma5[i],
      _maCache.ma20[i],
      _maCache.ma60[i],
      bar.volume,
      dateFmt(_ts(bar.date))
    );
  }
  // 전역에서 호출 가능하도록 노출
  window._showLatestInfo = showLatestInfo;

  // "YYYY-MM-DD" → UTC timestamp (dateFmt 입력용)
  function _ts(dateStr) {
    const [y, m, d] = dateStr.split('-').map(Number);
    return Date.UTC(y, m - 1, d) / 1000;
  }

  // 크로스헤어 이동: param.time만 사용해서 displayedData에서 직접 바 조회
  // (param.seriesData에 의존하지 않음 — 커서가 캔들 본체 밖이라도 시간만 있으면 동작)
  candleChart.subscribeCrosshairMove(param => {
    // 시간 또는 데이터가 없으면 최신 정보로 폴백
    if (!param || !param.time || !displayedData.length) {
      showLatestInfo();
      return;
    }

    const dateKey = _ts2key(param.time);
    if (!dateKey) { showLatestInfo(); return; }

    const idx = displayedData.findIndex(d => d.date === dateKey);
    if (idx < 0) { showLatestInfo(); return; }

    const bar       = displayedData[idx];
    const prevClose = idx > 0 ? displayedData[idx - 1].close : bar.open;

    _renderInfoPanel(
      bar, prevClose,
      _maCache.ma5[idx],
      _maCache.ma20[idx],
      _maCache.ma60[idx],
      bar.volume,
      dateFmt(param.time)
    );
  });

  // 반응형 — 차트 너비를 컨테이너에 맞춤
  function resizeCharts() {
    const w = document.getElementById('chart-wrap').clientWidth - 32; // padding 16*2
    if (w > 0) {
      candleChart.applyOptions({ width: w });
      volumeChart.applyOptions({ width: w });
    }
  }
  window.addEventListener('resize', resizeCharts);
  // 초기 너비 강제 적용 (display:none 해제 타이밍 문제 방지)
  setTimeout(resizeCharts, 50);
}

// ── 지표 계산 ─────────────────────────────────────────────────────────────────
function calcMA(data, n) {
  return data.map((d, i) => {
    if (i < n - 1) return null;
    const sum = data.slice(i - n + 1, i + 1).reduce((s, x) => s + x.close, 0);
    return { time: d.date, value: sum / n };
  }).filter(Boolean);
}

function calcBB(data, n = 20, k = 2) {
  const upper = [], mid = [], lower = [];
  data.forEach((d, i) => {
    if (i < n - 1) return;
    const slice = data.slice(i - n + 1, i + 1);
    const avg   = slice.reduce((s, x) => s + x.close, 0) / n;
    const std   = Math.sqrt(slice.reduce((s, x) => s + (x.close - avg) ** 2, 0) / n);
    upper.push({ time: d.date, value: avg + k * std });
    mid.push(  { time: d.date, value: avg });
    lower.push({ time: d.date, value: avg - k * std });
  });
  return { upper, mid, lower };
}

// ── 데이터 설정 ───────────────────────────────────────────────────────────────
function applyData(data) {
  displayedData = data;
  displayedBars = data.length;

  // 인덱스 정렬 MA 캐시 (정보 패널 빠른 조회용; calcMA는 n-1까지 null이므로 동일하게 채움)
  _maCache.ma5  = data.map((_, i) => {
    if (i < 4)  return null;
    return data.slice(i - 4, i + 1).reduce((s, x) => s + x.close, 0) / 5;
  });
  _maCache.ma20 = data.map((_, i) => {
    if (i < 19) return null;
    return data.slice(i - 19, i + 1).reduce((s, x) => s + x.close, 0) / 20;
  });
  _maCache.ma60 = data.map((_, i) => {
    if (i < 59) return null;
    return data.slice(i - 59, i + 1).reduce((s, x) => s + x.close, 0) / 60;
  });

  // 캔들 데이터 (time 필드: "YYYY-MM-DD")
  const candles = data.map(d => ({
    time:  d.date,
    open:  d.open,
    high:  d.high,
    low:   d.low,
    close: d.close,
  }));

  // 거래량 (색상: 상승=빨강, 하락=파랑)
  const volumes = data.map((d, i) => {
    const prev  = i > 0 ? data[i - 1].close : d.open;
    const color = d.close > prev ? C_UP : (d.close < prev ? C_DOWN : C_FLAT);
    return { time: d.date, value: d.volume, color };
  });

  candleSeries.setData(candles);
  volumeSeries.setData(volumes);

  // MA
  seriesMap.ma5.setData(calcMA(data, 5));
  seriesMap.ma20.setData(calcMA(data, 20));
  seriesMap.ma60.setData(calcMA(data, 60));

  // 볼린저밴드
  const bb = calcBB(data, 20, 2);
  seriesMap.bbUpper.setData(bb.upper);
  seriesMap.bbMid.setData(bb.mid);
  seriesMap.bbLower.setData(bb.lower);

  // 데이터 적용 후 양 차트 모두 fitContent — 가시 범위 강제 리셋
  // (기간 변경 시 이전 줌 상태가 남는 문제 방지)
  candleChart.timeScale().fitContent();
  volumeChart.timeScale().fitContent();

  // 캔들의 최종 범위를 거래량에도 명시적으로 전파 (초기 동기화 보장)
  const finalRange = candleChart.timeScale().getVisibleLogicalRange();
  if (finalRange) volumeChart.timeScale().setVisibleLogicalRange(finalRange);

  // 정보 패널 초기값 = 최신(오늘) 데이터
  if (typeof window._showLatestInfo === 'function') window._showLatestInfo();
}

// ── 기간 필터 ─────────────────────────────────────────────────────────────────
function setPeriod(months) {
  currentPeriod = months;
  document.querySelectorAll('.period-btn').forEach(btn => {
    btn.classList.toggle('active', parseInt(btn.dataset.months) === months);
  });

  let filtered = allData;
  if (months > 0) {
    const cutoff = new Date();
    cutoff.setMonth(cutoff.getMonth() - months);
    const cutStr = cutoff.toISOString().slice(0, 10);
    filtered = allData.filter(d => d.date >= cutStr);
  }
  applyData(filtered);
}

// ── 지표 토글 ─────────────────────────────────────────────────────────────────
function toggleSeries(key) {
  const checked = document.getElementById(`chk-${key}`).checked;
  if (key === 'bb') {
    seriesMap.bbUpper.applyOptions({ visible: checked });
    seriesMap.bbMid.applyOptions(  { visible: checked });
    seriesMap.bbLower.applyOptions({ visible: checked });
  } else {
    seriesMap[key].applyOptions({ visible: checked });
  }
}

// ── 헤더 가격 정보 업데이트 ───────────────────────────────────────────────────
async function updatePriceHeader(code) {
  try {
    const res  = await fetch(`${API}/api/ohlcv/${code}/latest`);
    if (!res.ok) return;
    const d    = await res.json();
    const cls  = d.change_pct > 0 ? 'up' : (d.change_pct < 0 ? 'down' : 'flat');
    const sign = d.change_pct > 0 ? '+' : '';
    document.getElementById('current-price').innerHTML =
      `<span class="${cls}">${d.close.toLocaleString()}원</span>`;
    document.getElementById('change-info').innerHTML =
      `<span class="${cls}">${sign}${d.change.toLocaleString()}원 (${sign}${d.change_pct}%)</span>`;

    // ── 종가/추출시점 판별 ──
    // KRX 정규장 마감 = 15:30 KST
    // - 데이터 날짜가 오늘보다 이전 → 확정 종가
    // - 같은 날 & _generated_at 15:30 이후 → 확정 종가
    // - 같은 날 & _generated_at 15:30 이전 → 추출 시각 시점
    let sourceText = `종가 · ${d.date}`;
    const todayStr = new Date().toISOString().slice(0, 10);
    const genAt    = d._generated_at;   // "2026-05-19 14:32"
    if (genAt && d.date >= todayStr) {
      const [genDate, genTime] = genAt.split(' ');
      if (genDate === d.date && genTime) {
        const [hh, mm] = genTime.split(':').map(Number);
        const isAfterClose = (hh * 60 + mm) >= (15 * 60 + 30);
        sourceText = isAfterClose
          ? `종가 · ${d.date}`
          : `${d.date} ${genTime} 기준`;
      }
    }
    document.getElementById('price-source').innerHTML =
      `<span class="ps-tag">${sourceText}</span>`;
  } catch(e) {}
}

// ── status 표시 헬퍼 ─────────────────────────────────────────────────────────
function showStatus(msg) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.classList.add('visible');
}
function hideStatus() {
  document.getElementById('status').classList.remove('visible');
}

// ── 메인 로드 함수 ────────────────────────────────────────────────────────────
async function loadChart() {
  const raw = document.getElementById('input-code').value.trim();
  if (!raw) return;

  showStatus('데이터를 불러오는 중...');

  try {
    // 차트 컨테이너가 렌더링된 뒤 초기화해야 너비를 정확히 잡음
    if (!candleChart) initCharts();

    // 종목코드 6자리가 아니면 검색 API로 먼저 resolve
    let code = raw;
    if (!/^\d{6}$/.test(raw)) {
      const sr = await fetch(`${API}/api/search?q=${encodeURIComponent(raw)}&limit=1`);
      const sj = await sr.json();
      if (!sj.results?.length) throw new Error(`"${raw}" 검색 결과 없음`);
      code = sj.results[0].stock_code;
    }

    // 기업명
    const cr = await fetch(`${API}/api/company/${code}`);
    if (cr.ok) {
      const cj = await cr.json();
      document.getElementById('corp-title').textContent =
        `${cj.corp_name}  (${code})`;
    }

    // OHLCV 전체
    const or = await fetch(`${API}/api/ohlcv/${code}`);
    if (!or.ok) throw new Error(`OHLCV 없음 — build_ohlcv.py 먼저 실행하세요 (${code})`);
    const oj = await or.json();
    allData = oj.data;

    if (!allData.length) throw new Error('데이터 없음');

    // 기간 적용
    setPeriod(currentPeriod);

    // 헤더 가격
    await updatePriceHeader(code);

    hideStatus();

  } catch(e) {
    showStatus('오류: ' + e.message);
  }
}

// ── 엔터키 검색 ───────────────────────────────────────────────────────────────
document.getElementById('input-code').addEventListener('keydown', e => {
  if (e.key === 'Enter') loadChart();
});

// ── 초기 로드 ─────────────────────────────────────────────────────────────────
window.addEventListener('load', loadChart);
</script>
