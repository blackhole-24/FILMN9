<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>기업가치 평가 — 현재가 적절성 진단</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{--navy:#1b3a5b;--blue:#2d6cb5;--green:#16a34a;--red:#dc2626;--amber:#d97706;
        --gray:#64748b;--lgray:#f1f5f9;--bd:#e2e8f0;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Malgun Gothic','Segoe UI',sans-serif;background:#f8fafc;color:#1e293b;line-height:1.5;}
  header{background:var(--navy);color:#fff;padding:18px 28px;}
  header h1{font-size:20px;font-weight:700;}
  header p{font-size:12px;opacity:.8;margin-top:3px;}
  .bar{background:#fff;border-bottom:1px solid var(--bd);padding:16px 28px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .bar input{padding:10px 14px;border:1px solid var(--bd);border-radius:8px;font-size:15px;width:240px;}
  .bar button{padding:10px 22px;background:var(--blue);color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;}
  .bar button:hover{background:var(--navy);}
  .bar .recent{font-size:12px;color:var(--gray);}
  .bar .recent a{color:var(--blue);cursor:pointer;margin-right:8px;text-decoration:none;}
  main{max-width:1180px;margin:0 auto;padding:24px 28px 60px;}
  .hint{color:var(--gray);font-size:13px;padding:40px;text-align:center;}
  #loading{display:none;text-align:center;padding:50px;color:var(--blue);font-size:16px;}
  .spin{display:inline-block;width:22px;height:22px;border:3px solid var(--bd);border-top-color:var(--blue);
        border-radius:50%;animation:s 1s linear infinite;vertical-align:middle;margin-right:10px;}
  @keyframes s{to{transform:rotate(360deg)}}
  .grid{display:grid;gap:16px;}
  .g2{grid-template-columns:1fr 1fr;} .g3{grid-template-columns:1fr 1fr 1fr;}
  @media(max-width:900px){.g2,.g3{grid-template-columns:1fr;}}
  .card{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:18px 20px;}
  .card h3{font-size:13px;color:var(--gray);font-weight:600;margin-bottom:10px;text-transform:uppercase;letter-spacing:.3px;}
  .headline{background:linear-gradient(135deg,#1b3a5b,#2d6cb5);color:#fff;border-radius:12px;padding:22px 24px;margin-bottom:18px;}
  .headline .verdict{font-size:13px;opacity:.85;margin-bottom:6px;}
  .headline .txt{font-size:17px;font-weight:600;line-height:1.5;}
  .big{font-size:30px;font-weight:800;}
  .sub{font-size:13px;color:var(--gray);}
  .pos{color:var(--green);} .neg{color:var(--red);} .neu{color:var(--gray);}
  .diag{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px;}
  @media(max-width:900px){.diag{grid-template-columns:1fr 1fr;}}
  .dcard{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:16px;text-align:center;border-top:4px solid var(--gray);}
  .dcard .lbl{font-size:11px;color:var(--gray);font-weight:600;}
  .dcard .val{font-size:22px;font-weight:800;margin:6px 0 3px;}
  .dcard .desc{font-size:11px;color:var(--gray);line-height:1.35;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{padding:7px 9px;text-align:right;border-bottom:1px solid var(--bd);}
  th:first-child,td:first-child{text-align:left;}
  th{color:var(--gray);font-weight:600;font-size:11px;text-transform:uppercase;}
  .tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;}
  .tag.u{background:#dcfce7;color:var(--green);} .tag.o{background:#fee2e2;color:var(--red);} .tag.n{background:#f1f5f9;color:var(--gray);}
  canvas{max-height:280px;}
  .err{background:#fef2f2;border:1px solid #fecaca;color:var(--red);padding:16px;border-radius:10px;}
  .footnote{font-size:11px;color:var(--gray);margin-top:6px;}
  /* ── 일반투자자용 설명 요소 ── */
  .tip{position:relative;display:inline-block;margin-left:5px;width:16px;height:16px;line-height:16px;
       text-align:center;border-radius:50%;background:#94a3b8;color:#fff;font-size:11px;font-weight:700;
       cursor:help;vertical-align:middle;}
  .tip .tiptext{visibility:hidden;opacity:0;position:absolute;z-index:60;bottom:150%;left:50%;
       transform:translateX(-50%);width:240px;max-width:78vw;background:#1e293b;color:#f1f5f9;text-align:left;
       border-radius:9px;padding:11px 13px;font-size:12.5px;font-weight:400;line-height:1.55;
       box-shadow:0 8px 24px rgba(0,0,0,.28);transition:opacity .15s;white-space:normal;}
  .tip .tiptext b{color:#fbbf24;}
  .tip .tiptext::after{content:"";position:absolute;top:100%;left:50%;margin-left:-6px;border:6px solid transparent;border-top-color:#1e293b;}
  .tip:hover .tiptext,.tip:focus .tiptext{visibility:visible;opacity:1;}
  .plain{background:#f0f9ff;border:1px solid #bae6fd;border-left:5px solid var(--blue);border-radius:10px;
         padding:16px 18px;margin-bottom:18px;}
  .plain h4{font-size:14px;color:#0369a1;margin-bottom:9px;}
  .plain p{font-size:14px;line-height:1.75;color:#1e3a5f;margin:6px 0;}
  .plain .em{font-weight:700;color:#0c4a6e;}
  .guide{background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:14px 18px;margin-top:18px;
         font-size:13px;line-height:1.7;color:#78350f;}
  .guide b{color:#92400e;}
  .legend{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--gray);margin:8px 0 2px;}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .dot{width:11px;height:11px;border-radius:3px;display:inline-block;}
  .glossary{margin-top:20px;background:#fff;border:1px solid var(--bd);border-radius:10px;padding:4px 18px;}
  .glossary summary{cursor:pointer;font-weight:700;color:var(--navy);padding:12px 0;font-size:14px;}
  .glossary dl{display:grid;grid-template-columns:150px 1fr;gap:9px 14px;font-size:13px;padding:6px 0 14px;}
  .glossary dt{font-weight:700;color:var(--blue);}
  .glossary dd{color:#475569;line-height:1.6;margin:0;}
  @media(max-width:700px){.glossary dl{grid-template-columns:1fr;}.glossary dt{margin-top:6px;}}
  .disclaimer{font-size:11px;color:var(--gray);text-align:center;margin-top:26px;padding-top:14px;border-top:1px solid var(--bd);line-height:1.6;}
</style>
</head>
<body>
<header>
  <h1>📊 이 주식, 지금 가격이 적당할까?</h1>
  <p>회사의 '진짜 가치'를 계산해서 현재 주가가 비싼지·싼지 쉽게 알려드립니다 · 어려운 용어엔 모두 <b>ⓘ</b> 설명이 있어요 · 투자 권유가 아닌 학습·참고용</p>
</header>
<div class="bar">
  <input id="ticker" placeholder="종목코드 또는 회사명 (예: 035420, 삼성전기)" onkeydown="if(event.key==='Enter')go()">
  <button onclick="go()">평가</button>
  <span class="recent" id="recent"></span>
</div>
<main>
  <div id="hint" class="hint">종목을 입력하고 평가를 누르세요. 처음 보는 종목은 수 분 소요될 수 있습니다(분기보고서 임베딩·피어 수집).</div>
  <div id="loading">
    <div><span class="spin"></span><span id="loadtxt">평가 중…</span></div>
    <div id="progwrap" style="display:none;max-width:440px;margin:18px auto 0;">
      <div style="background:var(--bd);border-radius:8px;height:10px;overflow:hidden;">
        <div id="progbar" style="background:var(--blue);height:100%;width:0%;transition:width .5s ease;"></div>
      </div>
      <div id="progpct" style="font-size:12px;color:var(--gray);margin-top:7px;">0%</div>
    </div>
  </div>
  <div id="result" style="display:none;"></div>
</main>

<script>
const W = (n,d=0)=> n==null?'—':Number(n).toLocaleString('ko-KR',{maximumFractionDigits:d});
const PCT = (x,d=1)=> x==null?'—':(x*100).toFixed(d)+'%';
const SPCT = (x,d=1)=> x==null?'—':((x>=0?'+':'')+(x*100).toFixed(d)+'%');
let charts=[];
function clearCharts(){charts.forEach(c=>c.destroy());charts=[];}

async function loadRecent(){
  try{const r=await fetch('/api/recent');const d=await r.json();
    document.getElementById('recent').innerHTML='최근: '+d.slice(0,6).map(x=>`<a onclick="quick('${x.ticker}')">${x.name}</a>`).join('');
  }catch(e){}
}
function quick(t){document.getElementById('ticker').value=t;go();}

let pollTimer=null;
function setLoad(msg,pct){
  document.getElementById('loading').style.display='block';
  document.getElementById('loadtxt').textContent=msg;
  const pw=document.getElementById('progwrap');
  if(pct==null){pw.style.display='none';}
  else{pw.style.display='block';
       document.getElementById('progbar').style.width=pct+'%';
       document.getElementById('progpct').textContent=pct+'%  (예상 진행률)';}
}
function finishLoad(){document.getElementById('loading').style.display='none';
  if(pollTimer){clearInterval(pollTimer);pollTimer=null;}}
function showErr(m){finishLoad();
  document.getElementById('result').innerHTML=`<div class="err">⚠ ${m}</div>`;
  document.getElementById('result').style.display='block';}

async function go(){
  const t=document.getElementById('ticker').value.trim();
  if(!t)return;
  const force=0;   // 일반투자자용: 항상 캐시 우선(빠름). 신규 종목은 자동 평가.
  if(pollTimer){clearInterval(pollTimer);pollTimer=null;}
  document.getElementById('hint').style.display='none';
  document.getElementById('result').style.display='none';
  setLoad('평가/조회 요청 중…',null);
  try{
    const r=await fetch(`/api/evaluate?ticker=${encodeURIComponent(t)}&force=${force}`);
    if(!r.ok){const e=await r.json();throw new Error(e.detail||'평가 실패');}
    const d=await r.json();
    if(d.status==='done'){finishLoad();render(d.result);return;}
    // queued/running → 폴링 시작
    if((d.queue_ahead||0)>1) setLoad(`대기 중… (앞에 ${d.queue_ahead-1}건 처리 중)`,null);
    pollStatus(d.job_id,t);
  }catch(e){showErr(e.message);}
}

function pollStatus(jobId,label){
  pollTimer=setInterval(async()=>{
    try{
      const r=await fetch(`/api/status/${jobId}`);
      if(!r.ok){const e=await r.json();throw new Error(e.detail||'상태 조회 실패');}
      const d=await r.json();
      if(d.status==='queued'){
        setLoad('대기 중… (앞 작업 완료를 기다립니다)',null);
      }else if(d.status==='running'){
        const sec=Math.round(d.elapsed||0);
        const mm=String(Math.floor(sec/60)).padStart(2,'0'),ss=String(sec%60).padStart(2,'0');
        setLoad(`${label} 평가 중…  경과 ${mm}:${ss}  (처음 보는 종목은 수 분 소요)`,
                Math.round((d.progress||0)*100));
      }else if(d.status==='done'){
        finishLoad();render(d.result);
      }else if(d.status==='error'){
        showErr(d.error||'평가 실패');
      }
    }catch(e){showErr(e.message);}
  },2000);
}

function sign(x){return x==null?'neu':(x>0?'pos':(x<0?'neg':'neu'));}

// ⓘ 툴팁 — 어려운 용어에 쉬운 설명을 붙인다. tabindex로 모바일 탭도 지원.
function tip(txt){return `<span class="tip" tabindex="0">ⓘ<span class="tiptext">${txt}</span></span>`;}

// 숫자들을 평범한 말로 풀어주는 '쉽게 말하면' 문단 생성
function plainLanguage(d){
  const s=d.summary||{}, dg=d.valuation_diagnostics||{};
  const cur=s.current_price, fair=s.fair_price;
  const gp=dg.growth_premium, ig=dg.implied_growth, mos=dg.margin_of_safety;
  const name=d.company?.name||'이 회사';
  const lines=[];
  // 1) 현재가 vs 적정가
  if(cur!=null && fair!=null){
    if(cur>fair){const pct=Math.round((cur/fair-1)*100);
      lines.push(`지금 <b>${name}</b> 주가는 <span class="em">₩${W(cur)}</span>인데, 우리가 계산한 '적정 가격'은 <span class="em">₩${W(fair)}</span>이에요. 즉 지금은 적정가보다 <span class="em">약 ${pct}% 비싼</span> 편입니다.`);}
    else{const pct=Math.round((1-cur/fair)*100);
      lines.push(`지금 <b>${name}</b> 주가는 <span class="em">₩${W(cur)}</span>인데, 우리가 계산한 '적정 가격'은 <span class="em">₩${W(fair)}</span>이에요. 즉 지금은 적정가보다 <span class="em">약 ${pct}% 싼</span> 편입니다.`);}
  } else if(cur!=null){
    lines.push(`지금 <b>${name}</b> 주가는 <span class="em">₩${W(cur)}</span>입니다. 이 회사는 미래 이익을 예측하기 불안정해 '적정 가격'을 숫자로 못 냈어요. 대신 아래 '성장 기대' 지표로 판단해 보세요.`);
  }
  // 2) 성장 기대분 (성장 프리미엄)
  if(gp!=null && dg.epv_price!=null){
    if(gp>0.05){lines.push(`지금 주가에는 "<b>앞으로 더 크게 성장할 것</b>"이라는 기대가 <span class="em">약 ${Math.round(gp*100)}%</span> 들어 있어요. 만약 성장이 멈추고 지금 버는 만큼만 계속 번다면, 한 주의 값어치는 <span class="em">₩${W(dg.epv_price)}</span> 정도예요.`);}
    else if(gp<-0.05){lines.push(`특이하게도 지금 주가는 회사가 <b>더 성장하지 않아도</b> 될 만큼 낮아요. 성장이 0이어도 값어치(₩${W(dg.epv_price)})가 현재가보다 높습니다 — 싸게 거래되고 있다는 신호일 수 있어요.`);}
    else{lines.push(`지금 주가는 회사의 '현재 버는 힘'에 거의 딱 맞는 수준이에요(성장 기대가 크지 않음). 본질 값어치는 한 주당 <span class="em">₩${W(dg.epv_price)}</span> 정도입니다.`);}
  }
  // 3) 그 기대가 현실적인가 (implied growth)
  if(ig!=null && dg.implied_growth_verdict){
    lines.push(`그 기대가 현실적인지 보려면: 지금 주가가 맞으려면 회사가 <span class="em">매년 ${SPCT(ig)}씩 영원히</span> 커져야 해요. 우리나라 경제 성장률(약 ${PCT(dg.gdp_growth_ref,0)})과 견주면 <span class="em">${dg.implied_growth_verdict}</span>입니다.`);
  }
  return lines;
}

// 주가가 요구하는 성장 속도 — 안정적 HTML 막대 게이지(초록/노랑/빨강 + 위치 마커)
function gaugeHtml(d){
  const dg=d.valuation_diagnostics||{}, s=d.summary||{};
  const ig=dg.implied_growth, gdp=dg.gdp_growth_ref||0.03, wacc=s.wacc||0.12;
  const lo=-0.10, hi=Math.max(wacc, gdp*2+0.02, 0.12), span=hi-lo;
  const col = ig==null?'#94a3b8':(ig<=gdp?'#16a34a':(ig<=gdp*2?'#d97706':'#dc2626'));
  const verdict = dg.implied_growth_verdict||'';
  const gw=Math.max(0,(gdp-lo)/span), yw=Math.max(0,(Math.min(gdp*2,hi)-gdp)/span), rw=Math.max(0,1-gw-yw);
  const pct = ig==null?null:Math.max(0,Math.min(1,(ig-lo)/span))*100;
  const valTxt = ig==null?'산출 불가':SPCT(ig);
  return `
   <div style="text-align:center;margin:6px 0 2px;">
     <div style="font-size:34px;font-weight:800;color:${col};line-height:1.1;">${valTxt}</div>
     <div style="font-size:12.5px;color:#64748b;margin-top:3px;line-height:1.4;">매년 영원히 이만큼 성장해야<br>지금 주가가 정당화돼요${verdict?` · <b style="color:${col}">${verdict}</b>`:''}</div>
   </div>
   <div style="position:relative;margin:34px 10px 2px;">
     ${pct==null?'':`<div style="position:absolute;left:${pct}%;top:-24px;transform:translateX(-50%);font-size:12.5px;font-weight:700;color:#1e293b;white-space:nowrap;">▼ 이 종목</div>`}
     <div style="display:flex;height:15px;border-radius:8px;overflow:hidden;">
       <div style="flex:${gw};background:#16a34a;"></div>
       <div style="flex:${yw};background:#d97706;"></div>
       <div style="flex:${rw};background:#dc2626;"></div>
     </div>
     <div style="display:flex;justify-content:space-between;font-size:10.5px;color:#94a3b8;margin-top:5px;">
       <span>현실적</span><span>경제성장 ${PCT(gdp,0)}</span><span>비현실적</span>
     </div>
   </div>`;
}

function render(d){
  clearCharts();
  const s=d.summary||{}, dg=d.valuation_diagnostics||{};
  const cur=s.current_price, fair=s.fair_price, up=s.upside_pct;
  const el=document.getElementById('result');

  // ── 분류 배지 + 맥락 주석 (성장프리미엄 기반) ──────────────
  const gp = dg.growth_premium;
  let badge='', bcol='#64748b', dcfNote='';
  if(gp!=null){
    if(gp>1){ badge='🚀 성장 기대주'; bcol='#d97706';
      dcfNote='현재가의 대부분이 <b>미래 성장 기대분</b>입니다. DCF 적정주가는 현재 펀더멘털 기준 <b>보수적 하한</b>이며, 시장은 미래 성장을 추가로 반영합니다. → 핵심은 아래 ‘시장함의 성장률’이 현실적인지 보는 것.'; }
    else if(gp<-0.1){ badge='💰 가치주 (저평가 신호)'; bcol='#16a34a';
      dcfNote='성장이 전혀 없어도 현재가가 본질가치(EPV)보다 낮습니다 — <b>하방 안전마진</b>이 존재합니다.'; }
    else { badge='⚖️ 펀더멘털 근접'; bcol='#2d6cb5';
      dcfNote='현재가가 본질가치(EPV)와 비슷한 수준입니다.'; }
  }
  const badgeHtml = badge ? ` · <span style="background:${bcol};color:#fff;padding:2px 11px;border-radius:20px;font-weight:700;font-size:12px">${badge}</span>` : '';

  const plainLines = plainLanguage(d);
  const plainHtml = plainLines.length
    ? `<div class="plain"><h4>🗣️ 쉽게 말하면</h4>${plainLines.map(l=>`<p>${l}</p>`).join('')}</div>` : '';

  let html = `
  <div class="headline">
    <div class="verdict">${d.company?.name||''} (${d.company?.ticker||''}) · 평가일 ${d.as_of_date||''} ${d._cache?'· 캐시':''}${badgeHtml}</div>
    <div class="txt">${dg.headline||'현재가 적절성 진단 데이터 없음'}</div>
  </div>
  ${plainHtml}
  <div class="grid g3" style="margin-bottom:18px;">
    <div class="card"><h3>현재 주가 ${tip('지금 증권시장에서 거래되는 1주의 가격이에요. 평가 기준일의 종가(마감 가격)입니다.')}</h3>
      <div class="big">₩${W(cur)}</div><div class="sub">시장이 매기는 값</div></div>
    <div class="card"><h3>적정주가 ${tip('우리 계산기가 회사의 미래 현금흐름을 예측해 추정한 1주의 정당한 가격이에요(DCF 방식). 현재가가 이보다 높으면 비싼 편, 낮으면 싼 편. 미래 예측이라 오차가 있어 절대적 정답은 아니고 참고용입니다.')}</h3>
      <div class="big">${fair==null?'산출불가':'₩'+W(fair)}</div>
      <div class="sub ${sign(up)}">${up==null?'계산 불가':'상승여력 '+SPCT(up/100)} ${up==null?'':tip('현재가가 적정주가까지 오를(+) 또는 내릴(−) 여지를 %로 본 거예요. +면 저평가, −면 고평가 신호.')}</div>
      ${dcfNote?`<div class="footnote" style="margin-top:8px;color:${bcol};line-height:1.4">${dcfNote}</div>`:''}</div>
    <div class="card"><h3>WACC ${tip('회사가 돈(주주 자본+빌린 돈)을 쓰는 데 드는 평균 비용률이에요. 미래의 돈을 현재 가치로 환산할 때 쓰는 할인율로, 높을수록 미래 이익을 더 깐깐하게 깎아서 봅니다. 보통 8~13%.')}</h3>
      <div class="big">${PCT(s.wacc,2)}</div>
      <div class="sub">자금 조달 비용 · Ke ${PCT(s.ke,2)} · Rf ${PCT(s.rf,2)}</div></div>
  </div>
  <div class="guide">
    <b>📖 결과 보는 법 (3단계)</b><br>
    ① 위 <b>🗣️ 쉽게 말하면</b>으로 큰 그림을 잡고, <b>적정주가 vs 현재 주가</b>로 비싼지·싼지 봅니다.<br>
    ② 아래 <b>5가지 진단</b>의 신호등 색(<b style="color:#16a34a">초록=유리</b> / <b style="color:#dc2626">빨강=주의</b>)으로 교차 확인하세요.<br>
    ③ 한 지표만 보지 말고 <b>여러 신호가 같은 방향</b>일 때 더 믿을 만합니다. ⚠ 미래 예측이 포함돼 <b>정답이 아닌 참고용</b>이에요.
  </div>`;

  // ── 현재가 적절성 진단 5종 ──
  if(dg.valid){
    const gp=dg.growth_premium, ig=dg.implied_growth, eg=dg.expectations_gap, mos=dg.margin_of_safety;
    const bt=(x,inv=false)=>{ // 신호등: inv=true면 음수가 좋음
      if(x==null)return'var(--gray)';
      const good = inv? x<0 : x>0;
      return good?'var(--green)':'var(--red)';
    };
    html += `<h3 style="font-size:15px;color:var(--navy);margin:6px 0 4px;font-weight:700;">🔍 지금 가격, 5가지로 진단해 봤어요</h3>
    <div class="legend">
      <span><i class="dot" style="background:var(--green)"></i> 초록 = 투자자에게 유리한 신호(싸거나 안전)</span>
      <span><i class="dot" style="background:var(--red)"></i> 빨강 = 주의 신호(비싸거나 기대 과함)</span>
      <span><i class="dot" style="background:var(--gray)"></i> 회색 = 중립/판단 보류</span>
    </div>
    <div class="diag">
      <div class="dcard" style="border-top-color:var(--blue)"><div class="lbl">① 본질 값어치 ${tip('EPV. 회사가 지금 버는 만큼만 앞으로도 번다고 가정(성장 0)했을 때의 1주 값어치예요. 미래 장밋빛 예측을 빼고 보수적으로 본 바닥 가치입니다.')}</div>
        <div class="val">₩${W(dg.epv_price)}</div><div class="desc">성장 0 가정<br>(보수적 바닥값)</div></div>
      <div class="dcard" style="border-top-color:${bt(gp,true)}"><div class="lbl">② 성장 기대분 ${tip('성장 프리미엄. 현재 주가 중에서 앞으로 더 성장할 거라는 기대가 차지하는 비율이에요. +50%면 주가의 절반이 미래 기대. 너무 높으면 거품 위험.')}</div>
        <div class="val" style="color:${bt(gp,true)}">${SPCT(gp)}</div><div class="desc">주가에 섞인 기대<br>(낮을수록 안전)</div></div>
      <div class="dcard" style="border-top-color:var(--gray)"><div class="lbl">③ 필요 성장률 ${tip('시장 함의 성장률. 지금 주가가 정당하려면 회사가 매년 몇 %씩 영원히 성장해야 하는지 거꾸로 계산한 값이에요. 경제성장률(약 3%)보다 훨씬 높으면 비현실적입니다.')}</div>
        <div class="val">${SPCT(ig)}</div><div class="desc">${dg.implied_growth_verdict||''}<br>(경제성장 ${PCT(dg.gdp_growth_ref,0)} 대비)</div></div>
      <div class="dcard" style="border-top-color:${bt(eg,true)}"><div class="lbl">④ 기대 vs 실력 ${tip('기대 격차. 시장이 요구하는 성장률(③)에서 회사가 스스로 벌어 성장할 수 있는 실력(SGR)을 뺀 값이에요. 양수면 시장 기대가 회사 실력보다 앞서간 것(과열).')}</div>
        <div class="val" style="color:${bt(eg,true)}">${SPCT(eg)}</div><div class="desc">시장 기대 − 회사 실력<br>(양수=과열)</div></div>
      <div class="dcard" style="border-top-color:${bt(mos)}"><div class="lbl">⑤ 안전마진 ${tip('Margin of Safety. 본질 값어치(①)보다 현재가가 얼마나 더 싼지예요. +30%면 가치보다 30% 싸게 사는 셈이라 하락 방어막이 있고, 음수면 방어막이 없습니다.')}</div>
        <div class="val" style="color:${bt(mos)}">${SPCT(mos)}</div><div class="desc">본질가치 대비 할인<br>(+면 하락 방어막)</div></div>
    </div>`;
  }

  // ── 결과 시각화 (가격대 + 성장속도 게이지) ──
  html += `<div class="grid g2">
    <div class="card"><h3>여러 방법으로 본 가격대 ${tip('한 가지 방법만 믿지 않도록, 보수적 가치(본질값어치)·낙관/비관 시나리오·동종업계 비교 등 여러 잣대로 추정한 가격을 한눈에 모았어요. 빨간 선이 현재가입니다.')}</h3><canvas id="cRange"></canvas>
      <div class="footnote">막대 = 방법별 추정 가격 / 빨간 점선 = 현재 주가. 현재가가 막대들보다 위면 비싼 편.</div></div>
    <div class="card"><h3>주가가 요구하는 성장 속도 ${tip('지금 주가가 정당하려면 회사가 매년 몇 %씩 영원히 커져야 하는지예요. 마커가 경제성장률(초록)을 넘어 빨간 쪽으로 갈수록 시장 기대가 과한 것.')}</h3>${gaugeHtml(d)}</div>
  </div>`;

  // ── 용어 사전 (계산 근거를 보기 전에 먼저) ──
  html += `<details class="glossary">
    <summary>📚 용어가 어렵다면 — 쉬운 풀이 펼치기</summary>
    <dl>
      <dt>적정주가 (DCF)</dt><dd>회사가 미래에 벌 현금을 예측해 오늘 가치로 환산한, 1주의 ‘정당한’ 가격. 현재가와 비교해 비싼지·싼지 가늠합니다.</dd>
      <dt>WACC (할인율)</dt><dd>회사가 돈을 쓰는 평균 비용률. 미래의 돈을 오늘 가치로 깎을 때 쓰는 비율로, 높을수록 미래 이익을 깐깐하게 봅니다.</dd>
      <dt>본질 값어치 (EPV)</dt><dd>회사가 지금 버는 만큼만 계속 번다고 볼 때(성장 0)의 보수적인 1주 가치. 미래 장밋빛 가정을 뺀 ‘바닥값’.</dd>
      <dt>성장 기대분</dt><dd>현재 주가 중 ‘앞으로 더 클 것’이라는 기대가 차지하는 비율. 높을수록 기대에 기댄 가격(거품 위험↑).</dd>
      <dt>필요 성장률</dt><dd>지금 주가가 맞으려면 회사가 매년 몇 %씩 영원히 커져야 하는지. 경제성장률(약 3%)보다 크게 높으면 비현실적.</dd>
      <dt>안전마진</dt><dd>본질 값어치보다 현재가가 얼마나 더 싼지. 클수록 하락에 대한 방어막이 두텁습니다.</dd>
      <dt>베타</dt><dd>시장이 1% 움직일 때 이 주식이 몇 % 움직이는지. 1보다 크면 시장보다 변동이 크다는 뜻.</dd>
      <dt>멀티플</dt><dd>비슷한 회사들이 시장에서 받는 가격 배수(PER 등)를 적용해 본 가격. 다른 각도의 교차 검증용.</dd>
    </dl>
  </details>`;

  // ── 구분선 + 계산 근거 (결과가 어떻게 나왔는지) ──
  html += `<div style="margin:22px 0 12px;border-top:1px dashed var(--bd);padding-top:16px;font-size:13.5px;color:var(--gray);font-weight:700;">🧮 아래는 위 결과가 <b>어떻게 나왔는지</b> 보여주는 계산 근거예요 (자세히 보고 싶을 때만)</div>
  <div class="grid g2">
    <div class="card"><h3>동종업계와 비교한 적정가 ${tip('비슷한 회사들이 시장에서 받는 가격 배수(PER·EV/EBITDA 등)를 이 회사에 적용하면 얼마가 나오는지예요. DCF와 다른 각도의 교차 검증.')}</h3><div id="multTbl"></div></div>
    <div class="card"><h3>주가 변동성(베타) 비교 ${tip('베타는 시장이 1% 움직일 때 이 주식이 몇 % 움직이는지예요. 1보다 크면 시장보다 출렁임이 크고, 위험이 커 할인율(WACC)도 올라갑니다.')}</h3><div id="peerTbl"></div></div>
  </div>
  <div class="grid" style="margin-top:16px;">
    <div class="card"><h3>할인율(WACC)은 어떻게 나왔나 ${tip('미래 현금을 깎는 비율(WACC)이 어떤 재료로 계산됐는지 보여줘요: 안전한 국채금리(Rf), 주식 위험 보상, 빌린 돈 이자 등.')}</h3><div id="waccTbl"></div></div>
  </div>
  <div class="disclaimer">
    본 결과는 공개된 재무·공시 데이터를 바탕으로 한 <b>자동 추정치</b>이며, 미래 예측이 포함되어 오차가 있을 수 있습니다.<br>
    특정 종목의 매수·매도를 권유하지 않으며, 투자 판단과 책임은 투자자 본인에게 있습니다. (학습·참고용)
  </div>`;

  el.innerHTML=html;
  el.style.display='block';
  drawRange(d); fillWacc(d); fillMult(d); fillPeer(d);
}

function drawRange(d){
  const s=d.summary||{}, dg=d.valuation_diagnostics||{}, sc=d.scenarios||{};
  const labels=[], vals=[], colors=[];
  if(dg.epv_price){labels.push('EPV(성장0)');vals.push(dg.epv_price);colors.push('#94a3b8');}
  if(sc.Bear)  {labels.push('Bear');vals.push(sc.Bear.price);colors.push('#f87171');}
  if(sc.Base)  {labels.push('Base');vals.push(sc.Base.price);colors.push('#60a5fa');}
  if(sc.Bull)  {labels.push('Bull');vals.push(sc.Bull.price);colors.push('#34d399');}
  if(s.fair_price){labels.push('DCF적정');vals.push(s.fair_price);colors.push('#2d6cb5');}
  const cur=s.current_price;
  const ctx=document.getElementById('cRange');
  charts.push(new Chart(ctx,{type:'bar',data:{labels,datasets:[{data:vals,backgroundColor:colors,borderRadius:5}]},
    options:{plugins:{legend:{display:false},
      annotation:{}, tooltip:{callbacks:{label:c=>'₩'+W(c.raw)}}},
      scales:{y:{ticks:{callback:v=>'₩'+W(v)}}},
      onResize:()=>{}}}));
  // 현재가 수평선 (커스텀 플러그인 대신 별도 데이터셋)
  if(cur){
    const c=charts[charts.length-1];
    c.options.plugins.tooltip.callbacks.title=()=>'';
    c.data.datasets.push({type:'line',label:'현재가',data:labels.map(()=>cur),
      borderColor:'#dc2626',borderWidth:2,borderDash:[6,4],pointRadius:0});
    c.update();
  }
}

function fillWacc(d){
  const rows=(d.wacc_breakdown||[]).map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td style="color:#64748b;font-size:11px">${r[2]||''}</td></tr>`).join('');
  document.getElementById('waccTbl').innerHTML=`<table><thead><tr><th>항목</th><th>값</th><th>근거</th></tr></thead><tbody>${rows}</tbody></table>`;
}

function fillMult(d){
  const cur=d.summary?.current_price;
  const rows=(d.multiples||[]).map(m=>{
    const v=m['역산가'], vs=cur?((v/cur-1)*100):null;
    const tg=vs==null?'n':(vs>0?'u':'o');
    return `<tr><td>${m['멀티플']}</td><td>${m['피어 중위']||''}</td><td>₩${W(v)}</td>
      <td><span class="tag ${tg}">${vs==null?'—':(vs>0?'+':'')+vs.toFixed(0)+'%'}</span></td></tr>`;
  }).join('');
  document.getElementById('multTbl').innerHTML=`<table><thead><tr><th>멀티플</th><th>피어중위</th><th>역산가</th><th>vs 현재</th></tr></thead><tbody>${rows}</tbody></table>`;
}

function fillPeer(d){
  const rows=(d.peer_beta||[]).map(p=>`<tr><td>${p['회사']}</td><td>${p['β_adj']??'—'}</td>
    <td>${p['R²']??'—'}</td><td style="color:#d97706;font-size:11px">${p['warn']==='-'?'':p['warn']||''}</td></tr>`).join('');
  document.getElementById('peerTbl').innerHTML=`<table><thead><tr><th>회사</th><th>β(adj)</th><th>R²</th><th>경고</th></tr></thead><tbody>${rows}</tbody></table>`;
}

loadRecent();
</script>
</body>
</html>
