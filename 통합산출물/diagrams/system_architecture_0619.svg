<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 840" font-family="Malgun Gothic, sans-serif" role="img">
  <title>FINSIGHT 시스템 아키텍처</title>
  <desc>EC2 2대. EC2#1은 nginx+FastAPI+Next.js로 웹/API를 운영하며 데이터는 RDS·MongoDB Atlas·S3(라이브 파일)에서 가져오고 EC2 로컬은 폴백이다. EC2#2는 GPU 챗봇과 ChromaDB를 데모 시 가동한다.</desc>
  <defs>
    <marker id="ar" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto"><path d="M0,0 L8,5 L0,10 z" fill="#475569"/></marker>
    <marker id="arp" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto"><path d="M0,0 L8,5 L0,10 z" fill="#7c3aed"/></marker>
    <marker id="aro" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto"><path d="M0,0 L8,5 L0,10 z" fill="#cc7a00"/></marker>
    <marker id="arg" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto"><path d="M0,0 L8,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="1440" height="840" fill="#ffffff"/>
  <text x="30" y="38" fill="#1f3a5f" font-size="23" font-weight="800">FINSIGHT · 시스템 아키텍처</text>
  <text x="30" y="61" fill="#64748b" font-size="13">EC2 2대 · 데이터: RDS · MongoDB Atlas · S3(라이브 파일 서빙, 로컬은 폴백) · GPU 챗봇·ChromaDB는 데모 시</text>

  <!-- 외부 -->
  <rect x="210" y="80" width="1210" height="36" rx="7" fill="#fef9ef" stroke="#f1d9a8"/>
  <text x="226" y="103" fill="#b45309" font-size="13" font-weight="700">🌐 외부:  DART 공시 · KRX·yfinance 시세 · 네이버 뉴스 · ECOS 금리 · OpenAI gpt-5-mini(챗봇 답변)</text>

  <!-- AWS -->
  <rect x="210" y="132" width="1210" height="690" rx="14" fill="none" stroke="#ff9900" stroke-width="2" stroke-dasharray="9 5"/>
  <text x="228" y="155" fill="#cc7a00" font-size="13.5" font-weight="700">AWS Cloud · ap-northeast-2 (서울)</text>

  <!-- 사용자 -->
  <rect x="24" y="400" width="162" height="124" rx="10" fill="#1f3a5f"/>
  <text x="105" y="450" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">사용자</text>
  <text x="105" y="474" fill="#cbd5e1" font-size="12" text-anchor="middle">개인투자자</text>
  <text x="105" y="494" fill="#cbd5e1" font-size="12" text-anchor="middle">(웹 브라우저)</text>

  <!-- EC2 #1 -->
  <rect x="232" y="184" width="546" height="334" rx="10" fill="#fffdf8" stroke="#ff9900" stroke-width="2"/>
  <rect x="232" y="184" width="546" height="32" rx="10" fill="#cc7a00"/>
  <text x="250" y="206" fill="#fff" font-size="13.5" font-weight="700">EC2 #1 · t3.micro · 웹 / API 상시 운영 (24/7)</text>
  <rect x="250" y="262" width="164" height="142" rx="8" fill="#fff" stroke="#0f766e" stroke-width="1.6"/>
  <rect x="250" y="262" width="164" height="28" rx="8" fill="#0f766e"/>
  <text x="332" y="282" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">nginx</text>
  <text x="332" y="312" fill="#0f172a" font-size="11.5" text-anchor="middle">리버스 프록시·웹서버</text>
  <text x="332" y="333" fill="#0f172a" font-size="11.5" text-anchor="middle">HTTPS 종료 80·443</text>
  <text x="332" y="354" fill="#0f172a" font-size="11.5" text-anchor="middle">요청 라우팅</text>
  <text x="332" y="375" fill="#64748b" font-size="10.5" text-anchor="middle">(/, /api, /chat)</text>
  <rect x="504" y="248" width="258" height="116" rx="8" fill="#fff" stroke="#4f46e5" stroke-width="1.6"/>
  <rect x="504" y="248" width="258" height="28" rx="8" fill="#4f46e5"/>
  <text x="633" y="268" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">FastAPI (백엔드 API)</text>
  <text x="633" y="298" fill="#0f172a" font-size="11.5" text-anchor="middle">REST 엔드포인트 :8090</text>
  <text x="633" y="319" fill="#0f172a" font-size="11.5" text-anchor="middle">라우터 · 서비스 로직</text>
  <text x="633" y="340" fill="#64748b" font-size="10.5" text-anchor="middle">systemd: finsight</text>
  <rect x="504" y="378" width="258" height="116" rx="8" fill="#fff" stroke="#2563eb" stroke-width="1.6"/>
  <rect x="504" y="378" width="258" height="28" rx="8" fill="#2563eb"/>
  <text x="633" y="398" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">Next.js 16 (화면)</text>
  <text x="633" y="428" fill="#0f172a" font-size="11.5" text-anchor="middle">React 19 · 화면 렌더링</text>
  <text x="633" y="449" fill="#0f172a" font-size="11.5" text-anchor="middle">standalone 서버 :3000</text>
  <text x="633" y="470" fill="#64748b" font-size="10.5" text-anchor="middle">systemd: finsight-web</text>
  <line x1="414" y1="302" x2="502" y2="302" stroke="#475569" stroke-width="1.7" marker-end="url(#ar)"/>
  <text x="416" y="294" fill="#475569" font-size="10.5">/api·손익흐름도</text>
  <line x1="414" y1="350" x2="502" y2="420" stroke="#475569" stroke-width="1.7" marker-end="url(#ar)"/>
  <text x="420" y="398" fill="#475569" font-size="10.5">/ (페이지)</text>

  <!-- 사용자 → nginx -->
  <line x1="186" y1="448" x2="248" y2="340" stroke="#475569" stroke-width="1.9" marker-end="url(#ar)"/>
  <text x="118" y="400" fill="#475569" font-size="10.5">HTTPS 요청·응답</text>

  <!-- FastAPI → 외부 -->
  <line x1="708" y1="248" x2="708" y2="118" stroke="#cc7a00" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#aro)"/>
  <text x="716" y="170" fill="#cc7a00" font-size="10.5">실시간 API 호출 (DART·시세·뉴스·금리)</text>

  <!-- 데이터 계층 (우측 이동 → 라벨 간격 확보) -->
  <rect x="855" y="230" width="275" height="96" rx="9" fill="#fff" stroke="#1f3a5f" stroke-width="1.6"/>
  <rect x="855" y="230" width="275" height="27" rx="9" fill="#1f3a5f"/>
  <text x="869" y="249" fill="#fff" font-size="12.5" font-weight="700">AWS RDS PostgreSQL</text>
  <text x="869" y="275" fill="#0f172a" font-size="11.5">정형 13테이블 (DB_BACKEND=postgres)</text>
  <text x="869" y="296" fill="#0f172a" font-size="11.5">기업개요·재무·밸류요약·주가·주주</text>
  <text x="869" y="315" fill="#64748b" font-size="10.5">관리형 DB · db.t3.micro</text>

  <rect x="855" y="342" width="275" height="90" rx="9" fill="#fff" stroke="#10654a" stroke-width="1.6"/>
  <rect x="855" y="342" width="275" height="27" rx="9" fill="#10654a"/>
  <text x="869" y="361" fill="#fff" font-size="12.5" font-weight="700">MongoDB Atlas (외부 관리형)</text>
  <text x="869" y="387" fill="#0f172a" font-size="11.5">histories — 히스토리 브리핑</text>
  <text x="869" y="408" fill="#0f172a" font-size="11.5">연결: pymongo (화이트리스트)</text>
  <text x="869" y="427" fill="#64748b" font-size="10.5">서술형 문서(NoSQL)</text>

  <!-- AWS S3 (라이브 서빙) -->
  <rect x="855" y="448" width="275" height="104" rx="9" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
  <rect x="855" y="448" width="275" height="27" rx="9" fill="#b45309"/>
  <text x="869" y="467" fill="#fff" font-size="12.5" font-weight="700">AWS S3 · 라이브 파일 서빙 ★</text>
  <text x="869" y="493" fill="#0f172a" font-size="11.5">손익흐름도 HTML · 밸류 통합JSON · 계열사 SVG</text>
  <text x="869" y="514" fill="#0f172a" font-size="11.5">boto3 + IAM 역할(읽기전용)</text>
  <text x="869" y="534" fill="#64748b" font-size="10.5">실측 18,397객체 · byte 일치 검증</text>

  <!-- EC2 로컬 (폴백) -->
  <rect x="1150" y="448" width="258" height="104" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="1164" y="469" fill="#64748b" font-size="12.5" font-weight="700">EC2 로컬 · 폴백(fallback)</text>
  <text x="1164" y="494" fill="#94a3b8" font-size="11">S3 장애 시 자동 대체</text>
  <text x="1164" y="514" fill="#94a3b8" font-size="11">손익흐름도 2,691개·32MB 등 보존</text>
  <text x="1164" y="534" fill="#94a3b8" font-size="11">(평소엔 미사용)</text>

  <!-- FastAPI → 데이터 (라벨이 박스에 안 닿게 좌측 여백에 배치) -->
  <line x1="762" y1="288" x2="853" y2="268" stroke="#475569" stroke-width="1.7" marker-end="url(#ar)"/>
  <text x="772" y="262" fill="#475569" font-size="10.5">SQL 조회</text>
  <line x1="762" y1="312" x2="853" y2="384" stroke="#475569" stroke-width="1.7" marker-end="url(#ar)"/>
  <text x="772" y="356" fill="#475569" font-size="10.5">pymongo</text>
  <line x1="762" y1="336" x2="853" y2="496" stroke="#b45309" stroke-width="2" marker-end="url(#aro)"/>
  <text x="772" y="436" fill="#b45309" font-size="10.5" font-weight="700">boto3 / IAM</text>
  <!-- S3 → 로컬 폴백 -->
  <line x1="1132" y1="500" x2="1148" y2="500" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arg)"/>
  <text x="1150" y="575" fill="#94a3b8" font-size="10">S3 실패 시 → 로컬 폴백</text>

  <!-- EC2 #2 -->
  <rect x="232" y="568" width="546" height="206" rx="10" fill="#faf8ff" stroke="#7c3aed" stroke-width="2.2"/>
  <rect x="232" y="568" width="546" height="32" rx="10" fill="#7c3aed"/>
  <text x="250" y="590" fill="#fff" font-size="13.5" font-weight="700">EC2 #2 · g4dn.xlarge GPU(T4) · 챗봇 — 데모 시 start/stop</text>
  <rect x="250" y="614" width="224" height="146" rx="8" fill="#fff" stroke="#a78bfa" stroke-width="1.6"/>
  <rect x="250" y="614" width="224" height="28" rx="8" fill="#8b5cf6"/>
  <text x="362" y="634" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">AI 챗봇 (RAG)</text>
  <text x="362" y="664" fill="#0f172a" font-size="11.5" text-anchor="middle">FastAPI :8800</text>
  <text x="362" y="685" fill="#0f172a" font-size="11.5" text-anchor="middle">임베딩·리랭킹·생성</text>
  <text x="362" y="706" fill="#64748b" font-size="10.5" text-anchor="middle">GPU(T4) 가속</text>
  <text x="362" y="727" fill="#64748b" font-size="10.5" text-anchor="middle">출처카드·DART링크</text>
  <rect x="540" y="614" width="224" height="146" rx="8" fill="#fff" stroke="#a78bfa" stroke-width="1.6"/>
  <rect x="540" y="614" width="224" height="28" rx="8" fill="#7c3aed"/>
  <text x="652" y="634" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">ChromaDB (벡터)</text>
  <text x="652" y="664" fill="#0f172a" font-size="11.5" text-anchor="middle">사업보고서 임베딩</text>
  <text x="652" y="685" fill="#0f172a" font-size="11.5" text-anchor="middle">~40GB · EBS 디스크</text>
  <text x="652" y="706" fill="#64748b" font-size="10.5" text-anchor="middle">같은 EC2 로컬 접근</text>
  <text x="652" y="727" fill="#64748b" font-size="10.5" text-anchor="middle">코사인 유사도 검색</text>
  <line x1="474" y1="682" x2="538" y2="682" stroke="#7c3aed" stroke-width="1.9" marker-end="url(#arp)"/>
  <text x="506" y="700" fill="#7c3aed" font-size="10" text-anchor="middle">로컬 검색</text>

  <!-- nginx → EC2#2 /chat -->
  <line x1="320" y1="404" x2="330" y2="566" stroke="#7c3aed" stroke-width="1.9" marker-end="url(#arp)"/>
  <text x="216" y="500" fill="#7c3aed" font-size="10.5">/chat (프록시)</text>

  <!-- 챗봇 → OpenAI -->
  <line x1="764" y1="660" x2="1118" y2="640" stroke="#7c3aed" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#arp)"/>
  <text x="906" y="632" fill="#7c3aed" font-size="10.5">LLM 호출</text>
  <rect x="1120" y="610" width="270" height="74" rx="9" fill="#fff" stroke="#a78bfa" stroke-width="1.4"/>
  <text x="1134" y="636" fill="#0f172a" font-size="12.5" font-weight="700">OpenAI gpt-5-mini</text>
  <text x="1134" y="660" fill="#64748b" font-size="11">챗봇 답변 생성 (질의당 ~5원)</text>
</svg>
