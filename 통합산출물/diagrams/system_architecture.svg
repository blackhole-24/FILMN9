<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 800" font-family="Malgun Gothic, sans-serif" role="img">
  <title>FINSIGHT 시스템 아키텍처 - 실제 배포 구성</title>
  <desc>EC2 1대에 nginx+Next.js+FastAPI가 함께 동작. FastAPI는 RDS PostgreSQL, MongoDB Atlas, EC2 로컬파일, 외부 실시간 API에서 데이터를 가져온다. GPU 챗봇 EC2와 ChromaDB는 6/19 배포 예정.</desc>
  <defs>
    <marker id="ar" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto"><path d="M0,0 L8,5 L0,10 z" fill="#475569"/></marker>
    <marker id="arp" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto"><path d="M0,0 L8,5 L0,10 z" fill="#7c3aed"/></marker>
  </defs>
  <rect x="0" y="0" width="1320" height="800" fill="#ffffff"/>
  <text x="30" y="34" fill="#1f3a5f" font-size="21" font-weight="800">FINSIGHT · 시스템 아키텍처 (실제 배포 구성)</text>
  <text x="30" y="55" fill="#64748b" font-size="12">EC2 1대(nginx + Next.js + FastAPI) · 데이터: RDS·MongoDB Atlas·EC2 로컬파일 · GPU 챗봇은 6/19 예정</text>

  <!-- 외부 실시간 (AWS 밖) -->
  <rect x="200" y="74" width="1100" height="32" rx="7" fill="#fef9ef" stroke="#f1d9a8"/>
  <text x="214" y="95" fill="#b45309" font-size="11.5" font-weight="700">🌐 외부 실시간/서비스 (AWS 밖):  DART 공시 · KRX·yfinance 시세 · 네이버 뉴스 · ECOS 금리 · OpenAI(LLM, 챗봇용)</text>

  <!-- AWS 경계 -->
  <rect x="200" y="120" width="1100" height="660" rx="14" fill="none" stroke="#ff9900" stroke-width="2" stroke-dasharray="9 5"/>
  <text x="216" y="142" fill="#cc7a00" font-size="12.5" font-weight="700">AWS Cloud · ap-northeast-2 (서울)</text>

  <!-- 사용자 -->
  <rect x="28" y="380" width="150" height="116" rx="10" fill="#1f3a5f"/>
  <text x="103" y="428" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">사용자</text>
  <text x="103" y="452" fill="#cbd5e1" font-size="11" text-anchor="middle">개인투자자</text>
  <text x="103" y="471" fill="#cbd5e1" font-size="11" text-anchor="middle">(웹 브라우저)</text>

  <!-- EC2 #1 (현재 운영) -->
  <rect x="222" y="170" width="478" height="328" rx="10" fill="#fffdf8" stroke="#ff9900" stroke-width="2"/>
  <rect x="222" y="170" width="478" height="30" rx="10" fill="#cc7a00"/>
  <text x="238" y="191" fill="#fff" font-size="12.5" font-weight="700">EC2 #1 · t3.micro · 현재 운영 — 1대에 3개 서비스</text>
  <!-- nginx -->
  <rect x="240" y="240" width="180" height="118" rx="8" fill="#fff" stroke="#0f766e" stroke-width="1.5"/>
  <rect x="240" y="240" width="180" height="26" rx="8" fill="#0f766e"/>
  <text x="330" y="258" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">nginx</text>
  <text x="330" y="286" fill="#0f172a" font-size="11" text-anchor="middle">리버스 프록시</text>
  <text x="330" y="306" fill="#0f172a" font-size="11" text-anchor="middle">HTTPS · 80/443</text>
  <text x="330" y="326" fill="#0f172a" font-size="11" text-anchor="middle">진입점 · 라우팅</text>
  <text x="330" y="347" fill="#64748b" font-size="9.5" text-anchor="middle">SSL: Let's Encrypt</text>
  <!-- Next.js -->
  <rect x="458" y="230" width="226" height="110" rx="8" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="458" y="230" width="226" height="26" rx="8" fill="#2563eb"/>
  <text x="571" y="248" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">Next.js 16 (화면)</text>
  <text x="571" y="276" fill="#0f172a" font-size="11" text-anchor="middle">React 19 · 화면 렌더</text>
  <text x="571" y="296" fill="#0f172a" font-size="11" text-anchor="middle">standalone :3000</text>
  <text x="571" y="316" fill="#64748b" font-size="9.5" text-anchor="middle">systemd: finsight-web</text>
  <!-- FastAPI -->
  <rect x="458" y="358" width="226" height="118" rx="8" fill="#fff" stroke="#4f46e5" stroke-width="1.5"/>
  <rect x="458" y="358" width="226" height="26" rx="8" fill="#4f46e5"/>
  <text x="571" y="376" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">FastAPI (백엔드)</text>
  <text x="571" y="404" fill="#0f172a" font-size="11" text-anchor="middle">REST API :8090</text>
  <text x="571" y="424" fill="#0f172a" font-size="11" text-anchor="middle">라우터 · 서비스</text>
  <text x="571" y="444" fill="#64748b" font-size="9.5" text-anchor="middle">systemd: finsight</text>
  <!-- 내부 라우팅 -->
  <line x1="420" y1="285" x2="456" y2="280" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="424" y="272" fill="#64748b" font-size="9.5">/ 화면</text>
  <line x1="420" y1="315" x2="456" y2="410" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="424" y="360" fill="#64748b" font-size="9.5">/api ·/sankey</text>

  <!-- 사용자 → nginx -->
  <line x1="178" y1="430" x2="238" y2="320" stroke="#475569" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="150" y="370" fill="#64748b" font-size="10">HTTPS</text>

  <!-- 데이터 계층 -->
  <rect x="740" y="222" width="270" height="96" rx="9" fill="#fff" stroke="#1f3a5f" stroke-width="1.5"/>
  <rect x="740" y="222" width="270" height="26" rx="9" fill="#1f3a5f"/>
  <text x="755" y="240" fill="#fff" font-size="12" font-weight="700">AWS RDS PostgreSQL</text>
  <text x="755" y="266" fill="#0f172a" font-size="11">정형 13테이블 (DB_BACKEND=postgres)</text>
  <text x="755" y="285" fill="#0f172a" font-size="11">기업개요·재무·밸류·주가·주주…</text>
  <text x="755" y="306" fill="#64748b" font-size="9.5">관리형 DB · db.t3.micro</text>

  <rect x="740" y="340" width="270" height="92" rx="9" fill="#fff" stroke="#10654a" stroke-width="1.5"/>
  <rect x="740" y="340" width="270" height="26" rx="9" fill="#10654a"/>
  <text x="755" y="358" fill="#fff" font-size="12" font-weight="700">MongoDB Atlas (외부 관리형)</text>
  <text x="755" y="384" fill="#0f172a" font-size="11">histories — AI 히스토리 브리핑</text>
  <text x="755" y="404" fill="#0f172a" font-size="11">연결: pymongo (화이트리스트)</text>
  <text x="755" y="424" fill="#64748b" font-size="9.5">서술형 문서(NoSQL)</text>

  <rect x="740" y="454" width="270" height="86" rx="9" fill="#fff" stroke="#b45309" stroke-width="1.5"/>
  <rect x="740" y="454" width="270" height="26" rx="9" fill="#b45309"/>
  <text x="755" y="472" fill="#fff" font-size="12" font-weight="700">EC2 로컬 파일</text>
  <text x="755" y="498" fill="#0f172a" font-size="11">Sankey HTML · 밸류 JSON · 계열사 이미지</text>
  <text x="755" y="518" fill="#0f172a" font-size="11">FastAPI가 /sankey/ 등으로 서빙</text>

  <!-- S3 (백업) -->
  <rect x="1040" y="454" width="240" height="86" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="1052" y="476" fill="#64748b" font-size="12" font-weight="700">AWS S3 · 백업 저장</text>
  <text x="1052" y="500" fill="#94a3b8" font-size="10.5">Sankey·밸류·계열사 백업본</text>
  <text x="1052" y="520" fill="#94a3b8" font-size="10.5">(현재 라이브 읽기경로 아님)</text>

  <!-- FastAPI → 데이터 -->
  <line x1="684" y1="400" x2="738" y2="270" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="690" y="330" fill="#64748b" font-size="9.5">SQL</text>
  <line x1="684" y1="418" x2="738" y2="386" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="690" y="404" fill="#64748b" font-size="9.5">pymongo</text>
  <line x1="684" y1="436" x2="738" y2="492" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="690" y="470" fill="#64748b" font-size="9.5">파일</text>
  <!-- FastAPI → 외부 실시간 (위로) -->
  <line x1="571" y1="358" x2="571" y2="108" stroke="#cc7a00" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <text x="578" y="160" fill="#cc7a00" font-size="9.5">실시간 호출(DART·시세·뉴스·금리)</text>

  <!-- EC2 #2 (예정) -->
  <rect x="222" y="560" width="478" height="170" rx="10" fill="#faf8ff" stroke="#7c3aed" stroke-width="2" stroke-dasharray="8 5"/>
  <rect x="222" y="560" width="478" height="30" rx="10" fill="#7c3aed"/>
  <text x="238" y="581" fill="#fff" font-size="12.5" font-weight="700">EC2 #2 · g4dn.xlarge GPU · 6/19 배포 예정 (현재 0대)</text>
  <rect x="242" y="606" width="210" height="104" rx="8" fill="#fff" stroke="#a78bfa" stroke-width="1.4"/>
  <text x="347" y="640" fill="#0f172a" font-size="12" font-weight="700" text-anchor="middle">AI 챗봇 (RAG)</text>
  <text x="347" y="662" fill="#0f172a" font-size="11" text-anchor="middle">:8800 · 임베딩·리랭킹</text>
  <text x="347" y="682" fill="#64748b" font-size="9.5" text-anchor="middle">데모 시에만 가동</text>
  <rect x="470" y="606" width="210" height="104" rx="8" fill="#fff" stroke="#a78bfa" stroke-width="1.4"/>
  <text x="575" y="640" fill="#0f172a" font-size="12" font-weight="700" text-anchor="middle">ChromaDB</text>
  <text x="575" y="662" fill="#0f172a" font-size="11" text-anchor="middle">사업보고서 벡터</text>
  <text x="575" y="682" fill="#64748b" font-size="9.5" text-anchor="middle">~40GB (EBS)</text>

  <!-- OpenAI (챗봇용, 예정) -->
  <rect x="1040" y="600" width="240" height="74" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="1052" y="624" fill="#64748b" font-size="12" font-weight="700">OpenAI gpt-5-mini</text>
  <text x="1052" y="648" fill="#94a3b8" font-size="10.5">챗봇 답변 생성 (6/19~)</text>
  <line x1="680" y1="658" x2="1038" y2="650" stroke="#a78bfa" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arp)"/>
  <line x1="452" y1="658" x2="468" y2="658" stroke="#a78bfa" stroke-width="1.4" marker-end="url(#arp)"/>
</svg>
