<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" font-family="Malgun Gothic, sans-serif" role="img">
  <title>FINSIGHT 데이터 파이프라인</title>
  <desc>ETL 표준 파이프라인. 수집에서 정규화·생성, 검증(NO-MOCK), 적재, 서빙까지 좌에서 우로 흐르며 배치와 실시간 레인으로 나뉜다.</desc>
  <defs>
    <marker id="arr2" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1280" height="760" fill="#ffffff"/>
  <text x="36" y="40" fill="#1f3a5f" font-size="22" font-weight="800">FINSIGHT · 데이터 파이프라인</text>
  <text x="36" y="60" fill="#64748b" font-size="12">ETL 표준 · 수집 → 정규화·생성 → 검증(NO-MOCK) → 적재 → 서빙 · 멱등 적재 · 배치/실시간 분리</text>

  <!-- 단계 헤더 -->
  <g font-size="13" font-weight="700" text-anchor="middle">
    <rect x="40"  y="90" width="200" height="34" rx="6" fill="#1f3a5f"/><text x="140"  y="113" fill="#fff">1. 수집 (Extract)</text>
    <rect x="270" y="90" width="200" height="34" rx="6" fill="#2563eb"/><text x="370" y="113" fill="#fff">2. 정규화·생성 (Transform)</text>
    <rect x="500" y="90" width="200" height="34" rx="6" fill="#0f766e"/><text x="600" y="113" fill="#fff">3. 검증 (NO-MOCK)</text>
    <rect x="730" y="90" width="220" height="34" rx="6" fill="#7c3aed"/><text x="840" y="113" fill="#fff">4. 적재 (Load · 4 저장소)</text>
    <rect x="980" y="90" width="260" height="34" rx="6" fill="#b45309"/><text x="1110" y="113" fill="#fff">5. 서빙 (Serve) → 사용자</text>
  </g>

  <!-- 1. 수집 -->
  <g>
    <rect x="40" y="140" width="200" height="330" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <rect x="55" y="160" width="170" height="44" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="140" y="186" font-size="11" text-anchor="middle" fill="#0f172a">DART 공시·재무 수집기</text>
    <rect x="55" y="216" width="170" height="44" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="140" y="237" font-size="11" text-anchor="middle" fill="#0f172a">사업보고서 전문</text><text x="140" y="252" font-size="9" text-anchor="middle" fill="#64748b">document.xml</text>
    <rect x="55" y="272" width="170" height="44" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="140" y="298" font-size="11" text-anchor="middle" fill="#0f172a">일일 주가(KRX/yfinance)</text>
    <rect x="55" y="328" width="170" height="44" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="140" y="354" font-size="11" text-anchor="middle" fill="#0f172a">금리·거시(ECOS)</text>
    <rect x="55" y="384" width="170" height="44" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="140" y="410" font-size="11" text-anchor="middle" fill="#0f172a">산업분류(WICS)</text>
  </g>

  <!-- 2. 정규화·생성 -->
  <g>
    <rect x="270" y="140" width="200" height="330" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <rect x="285" y="152" width="170" height="40" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="370" y="169" font-size="10.5" text-anchor="middle" fill="#0f172a">재무 표준화·파싱</text><text x="370" y="183" font-size="8.5" text-anchor="middle" fill="#64748b">3개년 B/S·I/S·CF</text>
    <rect x="285" y="196" width="170" height="40" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="370" y="213" font-size="10.5" text-anchor="middle" fill="#0f172a">밸류에이션 엔진</text><text x="370" y="227" font-size="8.5" text-anchor="middle" fill="#64748b">FCFF·WACC·DCF·4-Way</text>
    <rect x="285" y="240" width="170" height="40" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="370" y="257" font-size="10.5" text-anchor="middle" fill="#0f172a">손익흐름도 생성</text><text x="370" y="271" font-size="8.5" text-anchor="middle" fill="#64748b">Sankey HTML</text>
    <rect x="285" y="284" width="170" height="40" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="370" y="301" font-size="10.5" text-anchor="middle" fill="#0f172a">히스토리 브리핑 생성</text><text x="370" y="315" font-size="8.5" text-anchor="middle" fill="#64748b">LLM 요약·근거 인용</text>
    <rect x="285" y="328" width="170" height="40" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="370" y="345" font-size="10.5" text-anchor="middle" fill="#0f172a">계열사 구조도 생성</text><text x="370" y="359" font-size="8.5" text-anchor="middle" fill="#64748b">지분구조 SVG</text>
    <rect x="285" y="372" width="170" height="40" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="370" y="389" font-size="10.5" text-anchor="middle" fill="#0f172a">임베딩 생성</text><text x="370" y="403" font-size="8.5" text-anchor="middle" fill="#64748b">청크 분할·벡터화</text>
    <rect x="285" y="416" width="170" height="40" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="370" y="433" font-size="10.5" text-anchor="middle" fill="#0f172a">재무 건전성·신호등</text><text x="370" y="447" font-size="8.5" text-anchor="middle" fill="#64748b">위험신호 판정</text>
  </g>

  <!-- 3. 검증 -->
  <g>
    <rect x="500" y="140" width="200" height="330" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
    <rect x="515" y="180" width="170" height="60" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="600" y="205" font-size="11" text-anchor="middle" fill="#0f172a">출처 대조 검증</text><text x="600" y="223" font-size="10" text-anchor="middle" fill="#64748b">DART 원본 매칭</text>
    <rect x="515" y="250" width="170" height="60" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="600" y="275" font-size="11" text-anchor="middle" fill="#0f172a">브리핑 4-Phase 채점</text><text x="600" y="293" font-size="10" text-anchor="middle" fill="#64748b">수치·인용·RAGAS·Judge</text>
    <rect x="515" y="320" width="170" height="60" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="600" y="345" font-size="11" text-anchor="middle" fill="#0f172a">전수 헬스체크</text><text x="600" y="363" font-size="10" text-anchor="middle" fill="#64748b">분석가능 2,665종·14모듈</text>
    <rect x="515" y="390" width="170" height="60" rx="6" fill="#fffbeb" stroke="#fcd34d"/><text x="600" y="415" font-size="11" text-anchor="middle" fill="#92400e" font-weight="700">데이터 없으면</text><text x="600" y="433" font-size="10" text-anchor="middle" fill="#92400e">'데이터 없음' 정직표기</text>
  </g>

  <!-- 4. 적재 -->
  <g>
    <rect x="730" y="140" width="220" height="330" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <rect x="748" y="150" width="184" height="34" rx="6" fill="#eef2ff" stroke="#c7d2fe"/><text x="840" y="165" font-size="9" font-weight="700" text-anchor="middle" fill="#3730a3">빌드=로컬 SQLite 적재</text><text x="840" y="178" font-size="9" text-anchor="middle" fill="#4f46e5">→ push/이관 → RDS</text>
    <rect x="748" y="192" width="184" height="54" rx="6" fill="#fff" stroke="#cbd5e1"/><rect x="748" y="192" width="184" height="22" rx="6" fill="#1f3a5f"/><text x="840" y="208" font-size="10" font-weight="700" text-anchor="middle" fill="#fff">RDS PostgreSQL</text><text x="840" y="234" font-size="9.5" text-anchor="middle" fill="#0f172a">정형: 재무·주가·밸류요약</text>
    <rect x="748" y="252" width="184" height="48" rx="6" fill="#fff" stroke="#cbd5e1"/><rect x="748" y="252" width="184" height="22" rx="6" fill="#10654a"/><text x="840" y="268" font-size="10" font-weight="700" text-anchor="middle" fill="#fff">MongoDB</text><text x="840" y="291" font-size="9.5" text-anchor="middle" fill="#0f172a">히스토리 브리핑</text>
    <rect x="748" y="306" width="184" height="48" rx="6" fill="#fff" stroke="#cbd5e1"/><rect x="748" y="306" width="184" height="22" rx="6" fill="#7c3aed"/><text x="840" y="322" font-size="10" font-weight="700" text-anchor="middle" fill="#fff">ChromaDB</text><text x="840" y="345" font-size="9.5" text-anchor="middle" fill="#0f172a">사업보고서 벡터</text>
    <rect x="748" y="360" width="184" height="52" rx="6" fill="#fff" stroke="#cbd5e1"/><rect x="748" y="360" width="184" height="22" rx="6" fill="#b45309"/><text x="840" y="376" font-size="10" font-weight="700" text-anchor="middle" fill="#fff">S3</text><text x="840" y="399" font-size="9.5" text-anchor="middle" fill="#0f172a">Sankey·밸류통합JSON·계열사</text>
    <text x="840" y="440" font-size="10" text-anchor="middle" fill="#64748b">멱등 UPSERT (재실행 안전)</text>
  </g>

  <!-- 5. 서빙 -->
  <g>
    <rect x="980" y="140" width="260" height="330" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
    <rect x="998" y="175" width="224" height="52" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="1110" y="197" font-size="11" font-weight="700" text-anchor="middle" fill="#0f172a">FastAPI :8090</text><text x="1110" y="215" font-size="10" text-anchor="middle" fill="#64748b">REST · S3 우선/로컬 폴백</text>
    <rect x="998" y="237" width="224" height="52" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="1110" y="259" font-size="11" font-weight="700" text-anchor="middle" fill="#0f172a">RAG 서비스 :8800</text><text x="1110" y="277" font-size="10" text-anchor="middle" fill="#64748b">검색·리랭킹·LLM (GPU)</text>
    <rect x="998" y="299" width="224" height="52" rx="6" fill="#fff" stroke="#cbd5e1"/><text x="1110" y="321" font-size="11" font-weight="700" text-anchor="middle" fill="#0f172a">캐시 / 폴백</text><text x="1110" y="339" font-size="10" text-anchor="middle" fill="#64748b">응답 가속·가용성</text>
    <rect x="998" y="365" width="224" height="80" rx="6" fill="#1f3a5f"/><text x="1110" y="395" font-size="12" font-weight="700" text-anchor="middle" fill="#fff">웹 화면 (사용자)</text><text x="1110" y="418" font-size="10" text-anchor="middle" fill="#cbd5e1">기업개요·밸류·탐색·챗봇</text>
  </g>

  <!-- 단계 화살표 -->
  <g stroke="#475569" stroke-width="2" marker-end="url(#arr2)">
    <line x1="240" y1="300" x2="268" y2="300"/>
    <line x1="470" y1="300" x2="498" y2="300"/>
    <line x1="700" y1="300" x2="728" y2="300"/>
    <line x1="950" y1="300" x2="978" y2="300"/>
  </g>

  <!-- 배치/실시간 레인 -->
  <rect x="40" y="560" width="1200" height="56" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="56" y="582" fill="#2563eb" font-size="12" font-weight="700">⏱ 배치 (Batch)</text>
  <text x="56" y="602" fill="#0f172a" font-size="11">주가 OHLCV 매 거래일 동기화(16:00 스케줄러) · 사업보고서 갱신 시 재적재(멱등) · 브리핑·계열사·임베딩 배치 생성</text>
  <rect x="40" y="624" width="1200" height="56" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="56" y="646" fill="#15803d" font-size="12" font-weight="700">⚡ 실시간 (Realtime)</text>
  <text x="56" y="666" fill="#0f172a" font-size="11">실시간 시세(yfinance) · 글로벌 마켓 시그널 · 전자공시 라이브 조회(DART) · 뉴스(Naver) · AI 챗봇 질의응답</text>
</svg>
