&lt;style&gt;
  :root{--navy:#1b3a5b;--blue:#2d6cb5;--green:#16a34a;--red:#dc2626;--amber:#d97706;

  .method details{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:2px 16px;margin-top:10px;}

  /* ── 머티리얼 모달 (자세한 설명 팝업) ── */
  .modal-ov{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;z-index:200;

    &lt;div class=&quot;footnote&quot;&gt;막대 = 방법별 추정 가격 / 빨간 점선 = 현재 주가. 현재가가 막대들보다 위면 비싼 편.&lt;/div&gt;&lt;/div&gt;&lt;details class=&quot;glossary&quot;&gt;
    &lt;summary&gt;📚 용어가 어렵다면 — 쉬운 풀이 펼치기&lt;/summary&gt;
    &lt;dl&gt;
      &lt;dt&gt;적정주가 (DCF)&lt;/dt&gt;&lt;dd&gt;회사가 미래에 벌 현금을 예측해 오늘 가치로 환산한, 1주의 ‘정당한’ 가격. 현재가와 비교해 비싼지·싼지 가늠합니다.&lt;/dd&gt;
      &lt;dt&gt;WACC (할인율)&lt;/dt&gt;&lt;dd&gt;회사가 돈을 쓰는 평균 비용률. 미래의 돈을 오늘 가치로 깎을 때 쓰는 비율로, 높을수록 미래 이익을 깐깐하게 봅니다.&lt;/dd&gt;
      &lt;dt&gt;본질 값어치 (EPV)&lt;/dt&gt;&lt;dd&gt;회사가 지금 버는 만큼만 계속 번다고 볼 때(성장 0)의 보수적인 1주 가치. 미래 장밋빛 가정을 뺀 ‘바닥값’.&lt;/dd&gt;
      &lt;dt&gt;성장 기대분&lt;/dt&gt;&lt;dd&gt;현재 주가 중 ‘앞으로 더 클 것’이라는 기대가 차지하는 비율. 높을수록 기대에 기댄 가격(거품 위험↑).&lt;/dd&gt;
      &lt;dt&gt;필요 성장률&lt;/dt&gt;&lt;dd&gt;지금 주가가 맞으려면 회사가 매년 몇 %씩 영원히 커져야 하는지. 경제성장률(약 3%)보다 크게 높으면 비현실적.&lt;/dd&gt;
      &lt;dt&gt;안전마진&lt;/dt&gt;&lt;dd&gt;본질 값어치보다 현재가가 얼마나 더 싼지. 클수록 하락에 대한 방어막이 두텁습니다.&lt;/dd&gt;
      &lt;dt&gt;베타&lt;/dt&gt;&lt;dd&gt;시장이 1% 움직일 때 이 주식이 몇 % 움직이는지. 1보다 크면 시장보다 변동이 크다는 뜻.&lt;/dd&gt;
      &lt;dt&gt;멀티플&lt;/dt&gt;&lt;dd&gt;비슷한 회사들이 시장에서 받는 가격 배수(PER 등)를 적용해 본 가격. 다른 각도의 교차 검증용.&lt;/dd&gt;
      &lt;dt&gt;피어셋 (비교 대상)&lt;/dt&gt;&lt;dd&gt;이 회사와 사업·규모가 비슷해 비교 기준으로 고른 동종 회사들. 신뢰도 등급(A~E)으로 얼마나 잘 맞는 비교군인지 표시합니다.&lt;/dd&gt;
      &lt;dt&gt;사업 유사도&lt;/dt&gt;&lt;dd&gt;사업보고서 내용을 AI로 비교해 ‘하는 일이 얼마나 비슷한가’를 0~1로 점수화한 값. 높을수록 진짜 동종업계.&lt;/dd&gt;
      &lt;dt&gt;영업이익률 (OPM)&lt;/dt&gt;&lt;dd&gt;매출 100원당 본업에서 남기는 이익(원). 회사의 ‘장사 수익성’으로, 멀티플·적정가에 큰 영향을 줍니다.&lt;/dd&gt;
      &lt;dt&gt;순부채&lt;/dt&gt;&lt;dd&gt;갚을 빚(이자 내는 차입금)에서 보유 현금을 뺀 ‘실질 빚’. 기업가치에서 이걸 빼야 주주 몫이 남습니다.&lt;/dd&gt;
      &lt;dt&gt;지주회사&lt;/dt&gt;&lt;dd&gt;직접 장사보다 자회사 지분 보유가 주업인 회사. 일반 현금흐름 평가(DCF) 대신 자회사 가치 합산(NAV) 방식이 맞습니다.&lt;/dd&gt;
      &lt;dt&gt;동종 상·하위 25% (P75·P25)&lt;/dt&gt;&lt;dd&gt;비교 회사들을 배수 순으로 줄 세웠을 때 위·아래 1/4 지점. 이 회사가 상위 25%보다 비싸면 ‘동종 대비 고평가’ 신호입니다.&lt;/dd&gt;
    &lt;/dl&gt;

  &lt;div class=&quot;grid g2&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;동종업계와 비교한 적정가 &lt;span class=&quot;tip&quot; tabindex=&quot;0&quot;&gt;ⓘ&lt;span class=&quot;tiptext&quot;&gt;비슷한 회사들이 시장에서 받는 가격 배수(PER·EV/EBITDA 등)를 이 회사에 적용하면 얼마가 나오는지예요. DCF와 다른 각도의 교차 검증.&lt;/span&gt;&lt;/span&gt;&lt;/h3&gt;&lt;div id=&quot;multTbl&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;멀티플&lt;/th&gt;&lt;th&gt;피어중위&lt;/th&gt;&lt;th&gt;역산가&lt;/th&gt;&lt;th&gt;vs 현재&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;EV/EBITDA&lt;/td&gt;&lt;td&gt;17.54×&lt;/td&gt;&lt;td&gt;₩112,654&lt;/td&gt;
      &lt;td&gt;&lt;span class=&quot;tag o&quot;&gt;-16%&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;EV/Sales&lt;/td&gt;&lt;td&gt;1.06×&lt;/td&gt;&lt;td&gt;₩284,865&lt;/td&gt;
      &lt;td&gt;&lt;span class=&quot;tag u&quot;&gt;+112%&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;PER&lt;/td&gt;&lt;td&gt;37.72×&lt;/td&gt;&lt;td&gt;₩125,190&lt;/td&gt;
      &lt;td&gt;&lt;span class=&quot;tag o&quot;&gt;-7%&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;PBR&lt;/td&gt;&lt;td&gt;2.80×&lt;/td&gt;&lt;td&gt;₩229,295&lt;/td&gt;
      &lt;td&gt;&lt;span class=&quot;tag u&quot;&gt;+71%&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;주가 변동성(베타) 비교 &lt;span class=&quot;tip&quot; tabindex=&quot;0&quot;&gt;ⓘ&lt;span class=&quot;tiptext&quot;&gt;베타는 시장이 1% 움직일 때 이 주식이 몇 % 움직이는지예요. 1보다 크면 시장보다 출렁임이 크고, 위험이 커 할인율(WACC)도 올라갑니다.&lt;/span&gt;&lt;/span&gt;&lt;/h3&gt;&lt;div id=&quot;peerTbl&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;회사&lt;/th&gt;&lt;th&gt;β(adj)&lt;/th&gt;&lt;th&gt;R²&lt;/th&gt;&lt;th&gt;경고&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;현대건설&lt;/td&gt;&lt;td&gt;0.9045&lt;/td&gt;
    &lt;td&gt;0.177&lt;/td&gt;&lt;td style=&quot;color:#d97706;font-size:11px&quot;&gt;outliers&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;HJ중공업&lt;/td&gt;&lt;td&gt;0.694&lt;/td&gt;
    &lt;td&gt;0.021&lt;/td&gt;&lt;td style=&quot;color:#d97706;font-size:11px&quot;&gt;low_r_squared, outliers&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;DL이앤씨&lt;/td&gt;&lt;td&gt;0.7046&lt;/td&gt;
    &lt;td&gt;0.104&lt;/td&gt;&lt;td style=&quot;color:#d97706;font-size:11px&quot;&gt;outliers&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;한국항공우주&lt;/td&gt;&lt;td&gt;0.6071&lt;/td&gt;
    &lt;td&gt;0.069&lt;/td&gt;&lt;td style=&quot;color:#d97706;font-size:11px&quot;&gt;low_r_squared, outliers&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;grid&quot; style=&quot;margin-top:16px;&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;할인율(WACC)은 어떻게 나왔나 &lt;span class=&quot;tip&quot; tabindex=&quot;0&quot;&gt;ⓘ&lt;span class=&quot;tiptext&quot;&gt;미래 현금을 깎는 비율(WACC)이 어떤 재료로 계산됐는지 보여줘요: 안전한 국채금리(Rf), 주식 위험 보상, 빌린 돈 이자 등.&lt;/span&gt;&lt;/span&gt;&lt;/h3&gt;&lt;div id=&quot;waccTbl&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;항목&lt;/th&gt;&lt;th&gt;값&lt;/th&gt;&lt;th&gt;근거&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Rf (국고채 10년)&lt;/td&gt;&lt;td&gt;4.13%&lt;/td&gt;&lt;td style=&quot;color:#64748b;font-size:11px&quot;&gt;ECOS API&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;ERP&lt;/td&gt;&lt;td&gt;8.0%&lt;/td&gt;&lt;td style=&quot;color:#64748b;font-size:11px&quot;&gt;한공회 가이던스&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;βL,target (Blume)&lt;/td&gt;&lt;td&gt;0.700&lt;/td&gt;&lt;td style=&quot;color:#64748b;font-size:11px&quot;&gt;피어 4사 회귀 (winsorize)&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;SRP&lt;/td&gt;&lt;td&gt;-0.36%&lt;/td&gt;&lt;td style=&quot;color:#64748b;font-size:11px&quot;&gt;한공회 Mid&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;CRP&lt;/td&gt;&lt;td&gt;0.0%&lt;/td&gt;&lt;td style=&quot;color:#64748b;font-size:11px&quot;&gt;POC 정책&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Ke&lt;/td&gt;&lt;td&gt;9.38%&lt;/td&gt;&lt;td style=&quot;color:#64748b;font-size:11px&quot;&gt;= Rf + βL·ERP + SRP&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Kd&lt;/td&gt;&lt;td&gt;4.56%&lt;/td&gt;&lt;td style=&quot;color:#64748b;font-size:11px&quot;&gt;KOFIA 무보증 5년 × AA-&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;한계세율 t&lt;/td&gt;&lt;td&gt;27.5%&lt;/td&gt;&lt;td style=&quot;color:#64748b;font-size:11px&quot;&gt;3000억 초과&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Kd × (1−t)&lt;/td&gt;&lt;td&gt;3.31%&lt;/td&gt;&lt;td style=&quot;color:#64748b;font-size:11px&quot;&gt;세후 타인자본비용&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;E 비중&lt;/td&gt;&lt;td&gt;77.4%&lt;/td&gt;&lt;td style=&quot;color:#64748b;font-size:11px&quot;&gt;목표 자본구조&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;D 비중&lt;/td&gt;&lt;td&gt;22.6%&lt;/td&gt;&lt;td style=&quot;color:#64748b;font-size:11px&quot;&gt;목표 자본구조&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;WACC&lt;/td&gt;&lt;td&gt;8.01%&lt;/td&gt;&lt;td style=&quot;color:#64748b;font-size:11px&quot;&gt;가중평균&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;disclaimer&quot;&gt;
    본 결과는 공개된 재무·공시 데이터를 바탕으로 한 &lt;b&gt;자동 추정치&lt;/b&gt;이며, 미래 예측이 포함되어 오차가 있을 수 있습니다.&lt;br&gt;
    특정 종목의 매수·매도를 권유하지 않으며, 투자 판단과 책임은 투자자 본인에게 있습니다. (학습·참고용)
  &lt;/div&gt;&lt;/div&gt;

  &lt;!-- ── 신뢰성 근거: 이론·데이터·가정·한계 (평가와 무관하게 상시 노출) ── --&gt;
  &lt;section class=&quot;method&quot;&gt;
    &lt;h2&gt;🔬 이 분석은 어떤 근거로 만들어졌나요?&lt;/h2&gt;
    &lt;div class=&quot;lead&quot;&gt;모든 수치는 &lt;b&gt;공식·공개 데이터&lt;/b&gt;와 &lt;b&gt;재무학 표준 이론&lt;/b&gt;에 기반합니다. 임의의 값 없이, 사용한 출처·이론·가정·한계를 투명하게 공개합니다.&lt;/div&gt;

    &lt;div class=&quot;srcgrid&quot;&gt;
      &lt;div class=&quot;srccard&quot;&gt;&lt;div class=&quot;ic&quot;&gt;🏛️&lt;/div&gt;&lt;div class=&quot;nm&quot;&gt;DART&lt;/div&gt;&lt;div class=&quot;dt&quot;&gt;금융감독원 전자공시&lt;br&gt;재무제표·사업보고서&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;srccard&quot;&gt;&lt;div class=&quot;ic&quot;&gt;📈&lt;/div&gt;&lt;div class=&quot;nm&quot;&gt;KRX&lt;/div&gt;&lt;div class=&quot;dt&quot;&gt;한국거래소&lt;br&gt;주가·시가총액·상장정보&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;srccard&quot;&gt;&lt;div class=&quot;ic&quot;&gt;🏦&lt;/div&gt;&lt;div class=&quot;nm&quot;&gt;ECOS&lt;/div&gt;&lt;div class=&quot;dt&quot;&gt;한국은행 경제통계&lt;br&gt;무위험수익률(국고채)&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;srccard&quot;&gt;&lt;div class=&quot;ic&quot;&gt;📊&lt;/div&gt;&lt;div class=&quot;nm&quot;&gt;KOFIA&lt;/div&gt;&lt;div class=&quot;dt&quot;&gt;금융투자협회&lt;br&gt;채권시가평가수익률&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;details open=&quot;&quot;&gt;
      &lt;summary&gt;📐 이론적 토대 (재무학 표준 모델)&lt;/summary&gt;
      &lt;table class=&quot;thy&quot;&gt;
        &lt;thead&gt;&lt;tr&gt;&lt;th&gt;이론 / 모델&lt;/th&gt;&lt;th&gt;출처&lt;/th&gt;&lt;th&gt;우리 모델에서의 역할&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
        &lt;tbody&gt;
          &lt;tr&gt;&lt;td&gt;DCF (현금흐름할인)&lt;/td&gt;&lt;td&gt;재무학 표준&lt;/td&gt;&lt;td&gt;기업가치 = 미래 잉여현금흐름(FCFF)의 현재가치 합&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;CAPM&lt;/td&gt;&lt;td&gt;Sharpe (1964)&lt;/td&gt;&lt;td&gt;자기자본비용 Ke = 무위험수익률 + β × 시장위험프리미엄&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;베타 조정 (Hamada)&lt;/td&gt;&lt;td&gt;Hamada (1972)&lt;/td&gt;&lt;td&gt;자본구조(부채비율) 차이를 반영해 피어 베타를 보정&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;베타 안정화 (Blume)&lt;/td&gt;&lt;td&gt;Blume (1971)&lt;/td&gt;&lt;td&gt;조정베타 = ⅔×실측 + ⅓×1 + 이상치 제거(±3σ winsorize) — 장기적으로 1에 수렴하는 경향 반영&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;영구가치 (Gordon Growth)&lt;/td&gt;&lt;td&gt;Gordon (1959)&lt;/td&gt;&lt;td&gt;예측기간 이후 가치 = NOPAT/(WACC−g), 단 g ≤ 명목 GDP&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;지속가능성장률 (SGR)&lt;/td&gt;&lt;td&gt;Damodaran&lt;/td&gt;&lt;td&gt;성장률 상한 = ROIC × 재투자율 (펀더멘털 기반 성장)&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;EPV (이익창출가치)&lt;/td&gt;&lt;td&gt;Greenwald (2001)&lt;/td&gt;&lt;td&gt;성장 0 가정의 본질가치 = NOPAT / WACC&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Reverse DCF (함의성장률)&lt;/td&gt;&lt;td&gt;Damodaran&lt;/td&gt;&lt;td&gt;현재 주가를 정당화하는 영구성장률을 역산&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;기대 투자 (Expectations)&lt;/td&gt;&lt;td&gt;Rappaport &amp;amp; Mauboussin (2001)&lt;/td&gt;&lt;td&gt;시장 함의 성장 vs 회사 펀더멘털 실력의 격차&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;안전마진 (Margin of Safety)&lt;/td&gt;&lt;td&gt;Graham&lt;/td&gt;&lt;td&gt;본질가치 대비 현재가 할인폭 = 하방 방어막&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;피어 선정 원칙&lt;/td&gt;&lt;td&gt;Damodaran&lt;/td&gt;&lt;td&gt;동일 사업·규모·위험·성장 기준의 가중 점수화&lt;/td&gt;&lt;/tr&gt;
        &lt;/tbody&gt;
      &lt;/table&gt;
    &lt;/details&gt;

    &lt;details&gt;
      &lt;summary&gt;⚙️ 핵심 가정 (투명 공개)&lt;/summary&gt;
      &lt;ul class=&quot;assume&quot;&gt;
        &lt;li&gt;&lt;b&gt;시장위험프리미엄(ERP) 8%&lt;/b&gt; — 한국 시장 장기 추정치로 고정&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;영구성장률 g = 2.5%&lt;/b&gt; (≤ 명목 GDP) — 어떤 회사도 영원히 경제보다 빨리 클 수 없음 (Damodaran 제약)&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;명시적 예측 5년 + 영구가치&lt;/b&gt; — 5년간 성장률을 점진 수렴(fade)시킨 뒤 영구가치 결합&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;지속가능성장률로 성장 상한&lt;/b&gt; — 일시적 호황을 영구히 외삽하지 않도록 제어&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;할인율(WACC)의 자본구조&lt;/b&gt; — 회사의 &lt;b&gt;실제 부채비율(D/E)&lt;/b&gt;로 계산하되, 일시적 과부채는 산업(동종업계) 평균 상한으로 보정 (distress 왜곡 방지)&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;한계세율 적용&lt;/b&gt; — 과세구간별 실효세율로 세후이익 산출&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;TTM 하이브리드&lt;/b&gt; — 손익은 최근 4분기로 최신화, 자본·부채 항목은 연간 기준 유지&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;비영업자산(NOA) 장부가&lt;/b&gt; — 공정가 데이터 부재로 보수적 장부가 사용&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;멀티플은 trailing·피어 중위값&lt;/b&gt; — 이상치에 강한 중위값으로 교차검증&lt;/li&gt;
      &lt;/ul&gt;
    &lt;/details&gt;

    &lt;details&gt;
      &lt;summary&gt;🧭 평가 방법론 흐름&lt;/summary&gt;
      &lt;div class=&quot;flow&quot;&gt;
        &lt;span class=&quot;step&quot;&gt;① 공시·시장 데이터 수집&lt;/span&gt;&lt;span class=&quot;arr&quot;&gt;→&lt;/span&gt;
        &lt;span class=&quot;step&quot;&gt;② 유사기업 자동 선정&lt;/span&gt;&lt;span class=&quot;arr&quot;&gt;→&lt;/span&gt;
        &lt;span class=&quot;step&quot;&gt;③ 베타·WACC 산출&lt;/span&gt;&lt;span class=&quot;arr&quot;&gt;→&lt;/span&gt;
        &lt;span class=&quot;step&quot;&gt;④ DCF 적정주가&lt;/span&gt;&lt;span class=&quot;arr&quot;&gt;→&lt;/span&gt;
        &lt;span class=&quot;step&quot;&gt;⑤ 멀티플 교차검증&lt;/span&gt;&lt;span class=&quot;arr&quot;&gt;→&lt;/span&gt;
        &lt;span class=&quot;step&quot;&gt;⑥ 현재가 적절성 진단 5종&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;footnote&quot;&gt;미래 예측(DCF)과 예측이 거의 없는 현재가치(EPV·역산 진단)를 &lt;b&gt;함께&lt;/b&gt; 제시해 한쪽에 치우치지 않도록 설계했습니다.&lt;/div&gt;
    &lt;/details&gt;

    &lt;details&gt;
      &lt;summary&gt;⚠️ 한계 (정직한 고지)&lt;/summary&gt;
      &lt;ul class=&quot;assume&quot;&gt;
        &lt;li&gt;미래 현금흐름은 &lt;b&gt;예측&lt;/b&gt;이므로 실제와 다를 수 있습니다 (특히 경기민감·고성장주).&lt;/li&gt;
        &lt;li&gt;경영진 역량·산업 구조 변화 등 &lt;b&gt;정성 요인&lt;/b&gt;은 수치에 직접 반영되지 않습니다.&lt;/li&gt;
        &lt;li&gt;결과는 공시 데이터의 &lt;b&gt;품질·시점&lt;/b&gt;에 의존합니다.&lt;/li&gt;
        &lt;li&gt;본 결과는 &lt;b&gt;참고 자료&lt;/b&gt;이며 특정 종목의 매수·매도 권유가 아닙니다.&lt;/li&gt;
      &lt;/ul&gt;
    &lt;/details&gt;
  &lt;/section&gt;
&lt;/main&gt;
